<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Stem exam</title>
<style>
:root{--bg:#fff8e7;--card:#fff;--ink:#23324a;--pri:#ff7a1a;--ok:#2ea44f;--bad:#e5484d;--line:#e3d6b8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17202e;--card:#243247;--ink:#f3f6fb;--line:#3a4b66}}
:root[data-theme="dark"]{--bg:#17202e;--card:#243247;--ink:#f3f6fb;--line:#3a4b66}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
#app{max-width:640px;margin:0 auto;padding:12px 14px 40px}
h1{font-size:26px;margin:6px 0;text-align:center}h2{font-size:18px;margin:10px 0;text-align:center}h3{margin:18px 0 6px;font-size:17px;color:var(--pri)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.pill{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:4px 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:12px;text-align:center;font-size:16px;font-weight:700;color:var(--ink);cursor:pointer}
.sec b{display:block;font-size:30px}.sec small{display:block;font-size:18px;margin-top:2px;letter-spacing:2px}
button{font:inherit;color:inherit;cursor:pointer}
.bar{height:12px;background:var(--line);border-radius:8px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .4s}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card,.tile,.opt{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:6px;transition:transform .15s}
.card img{width:100%;aspect-ratio:1;object-fit:contain;display:block;border-radius:10px;background:#fff}
.good{border-color:var(--ok)!important;background:#d9f5e1!important;transform:scale(1.06)}.bad{border-color:var(--bad)!important;animation:sh .4s}
.sel{border-color:var(--pri)!important;transform:scale(1.04)}.done{opacity:.55;border-color:var(--ok);pointer-events:none}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.word{font-size:34px;font-weight:800;text-align:center;margin:6px 0 12px}.spk{border:0;background:none;font-size:28px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.slot{width:48px;height:58px;border:3px dashed var(--ink);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800}.slot.f{border-style:solid;border-color:var(--ok);color:var(--ok)}.slot.k{border-style:solid;border-color:var(--line)}
.tile{width:56px;height:60px;font-size:32px;font-weight:800;padding:0}.opt{min-width:64px;height:64px;font-size:36px;font-weight:800;padding:0}
.big{width:min(60%,230px);margin:0 auto;display:block}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px 60px;align-items:center}.mt .tile,.mt .card{width:100%;height:auto;min-height:74px}.lt{font-size:32px;font-weight:800}
.say{min-height:34px;text-align:center;font-size:21px;font-weight:800;color:var(--ok);margin:6px 0}
.btn{background:var(--pri);color:#fff;border:0;border-radius:16px;padding:12px 22px;font-size:18px;font-weight:800;margin:6px}.btn.g{background:var(--card);color:var(--ink);border:3px solid var(--line)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:9}.fin{text-align:center;padding-top:20px}.fin .st{font-size:56px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;position:sticky;top:0;background:var(--bg);z-index:5}.tab{flex:none;background:var(--card);border:3px solid var(--line);border-radius:14px;padding:8px 12px;font-weight:700;font-size:14px}.tab.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0}.dot{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);background:var(--card);font-weight:700;font-size:13px;padding:0}.dot.on{border-color:var(--pri);transform:scale(1.15)}.dot.d{background:var(--ok);border-color:var(--ok);color:#fff}
.nav{display:flex;justify-content:space-between;margin-top:8px}.say{min-height:30px;margin:2px 0 4px}
.mt{gap:8px 40px}.mt .tile,.mt .card{min-height:66px;display:flex;align-items:center;justify-content:center;padding:4px}.mt .card img{height:62px;width:auto;max-width:100%;aspect-ratio:auto}
.mt{gap:6px 28px}.mt .tile,.mt .card{min-height:46px;padding:2px}.mt .card img{height:44px}.mt .tile{font-size:20px}.mt .lt{font-size:34px!important}.nav .btn{padding:8px 16px;font-size:16px}.panel{text-align:center;padding:14px;border:3px solid var(--ok);border-radius:16px;margin-top:10px}
</style></head><body><canvas id="fx"></canvas><div id="app"></div>

function match(r,st){const P=r.p.map(p=>({l:p[0],img:p[1],key:p[2]}));
 const L=r.L?[...new Set(P.map(p=>p.key))].map(k=>({l:k,key:k,c:P.filter(p=>p.key==k).length})):P.map(p=>({l:p.l,key:p.key,c:1}));
 let R,t=0;do{R=sh(P)}while(t++<80&&R.some((x,n)=>L[n]&&L[n].key==x.key));let sel=null,left=P.length;
 st.innerHTML=`<div class="mt">${R.map((x,n)=>(L[n]?`<button class="tile lt" data-n="${n}" style="font-size:${r.L?44:20}px">${L[n].l}</button>`:'<span></span>')+`<button class="card" data-k="${x.key}"><img src="${IM[x.img]}" alt=""></button>`).join('')}</div>`;
 const Lb=[...st.querySelectorAll('[data-n]')];
 Lb.forEach(b=>b.onclick=()=>{Lb.forEach(x=>x.classList.remove('sel'));sel=b;b.classList.add('sel');say(b.textContent)});
 st.querySelectorAll('.card').forEach(b=>b.onclick=()=>{if(!sel)return;const l=L[+sel.dataset.n];if(l.key==b.dataset.k){b.classList.add('done');l.c--;sel.classList.remove('sel');if(!l.c)sel.classList.add('done');sel=null;good();if(--left==0)solved()}else no(b)})}
const tiles=a=>sh(a).map(l=>`<button class="tile" data-c="${l}">${l}</button>`).join('');
function fill(r,st,seq,slots){let p=0;st.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{if(b.dataset.c==seq[p]){const s=st.querySelectorAll(slots)[p];s.textContent=b.dataset.c;s.classList.add('f');b.classList.add('done');p++;beep(1);if(p==seq.length){good();say(r.w);solved()}}else no(b)})}
function spell(r,st){const w=r.w;st.innerHTML=`<img class="big card" src="${IM[r.i]}" alt=""><div class="row">${[...w].map(()=>'<div class="slot sp"></div>').join('')}</div><div class="row">${tiles([...w])}</div>`;fill(r,st,[...w],'.sp')}
function missing(r,st){const w=r.w,m=r.m;st.innerHTML=`<img class="big card" src="${IM[r.i]}" alt=""><div class="row">${[...w].map((c,k)=>m.includes(k)?'<div class="slot ms"></div>':`<div class="slot k">${c}</div>`).join('')}</div><div class="row">${tiles(m.map(k=>w[k]))}</div>`;fill(r,st,m.map(k=>w[k]),'.ms')}
function sound(r,st){st.innerHTML=`<img class="big card" src="${IM[r.i]}" alt=""><div class="word">${r.h?'':`<span style="color:var(--pri)">...${r.w.slice(1)}</span>`}<button class="spk">🔊</button></div><div class="row">${sh(r.o).map(l=>`<button class="opt" data-c="${l}">${l}</button>`).join('')}</div>`;
 st.querySelector('.spk').onclick=()=>say(r.w);say(r.w);
 st.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(b.dataset.c==r.a){b.classList.add('good');good();st.querySelectorAll('.opt').forEach(x=>x.style.pointerEvents='none');solved()}else no(b)})}
function fin(){const n=miss==0?3:miss<=3?2:1;S[cur.id]=Math.max(S[cur.id]||0,n);sv();app.innerHTML=`<div class="fin"><div class="st">${'⭐'.repeat(n)}</div><h1>${n==3?'PERFECT! 🏆':n==2?'Awesome work! 🎉':'Good try! Keep going! 💪'}</h1><p>You collected ${stars} stars in this game!</p><button class="btn" id="a">Play again 🔁</button><button class="btn g" id="m">Menu 🏠</button></div>`;$('#a').onclick=()=>start(cur.id);$('#m').onclick=menu;beep(1);burst(120)}
function burst(n){const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const P=[...Array(n)].map(()=>({x:c.width/2,y:c.height*.45,vx:(Math.random()-.5)*12,vy:-Math.random()*12-3,c:`hsl(${Math.random()*360},90%,60%)`,s:5+Math.random()*6}));let f=0;(function d(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.4;x.fillStyle=p.c;x.fillRect(p.x,p.y,p.s,p.s)});if(++f<70)requestAnimationFrame(d);else x.clearRect(0,0,c.width,c.height)})()}
menu();
</script></body></html>
