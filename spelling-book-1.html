<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Words to spell</title>
<style>
:root{--bg:#fff7e6;--card:#fff;--ink:#2b2b2b;--mut:#7a7a7a;--line:#e6dcc3;--ok:#2e9e5b;--bad:#e5484d;--sel:#ffe08a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1b17;--card:#2a2722;--ink:#f3efe6;--mut:#b5ad9d;--line:#4a443b;--ok:#4cc784;--bad:#ff6b70;--sel:#6b5316;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1b17;--card:#2a2722;--ink:#f3efe6;--mut:#b5ad9d;--line:#4a443b;--ok:#4cc784;--bad:#ff6b70;--sel:#6b5316;color-scheme:dark}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Chalkboard SE",system-ui,sans-serif}
main{max-width:480px;margin:0 auto;padding:10px 12px 24px}
button{font-family:inherit;color:var(--ink);cursor:pointer}
.row{display:flex;gap:6px;margin:6px 0;flex-wrap:wrap}.row.c{justify-content:center}
.bk{flex:1;border:3px solid transparent;border-radius:12px;padding:10px 4px;font-size:17px;font-weight:700;opacity:.6}
.bk.on{opacity:1;border-color:var(--ink)}
.chip{border:2px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;font-size:15px;font-weight:700}
.chip.on{background:var(--sel);border-color:var(--ink)}
.pv{border-radius:10px;padding:6px 10px;font-size:14px;font-weight:700;text-align:center;margin:4px 0}
.st{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;margin-top:8px;text-align:center}
.st p{margin:0 0 8px;color:var(--mut);font-size:15px}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots .d{background:var(--ok)}.dots .c{background:var(--ink)}
.dot{display:inline-block;border-radius:50%}
.big{font-size:60px;line-height:1.1;min-height:70px;display:flex;align-items:center;justify-content:center;margin:2px 0}
.big svg{height:62px;width:auto}.big .dot{width:62px;height:62px}
.wordbig{font-size:44px;font-weight:700;letter-spacing:3px;margin:6px 0}
.g{color:var(--ok)}.r{color:var(--bad)}
.spk{border:2px solid var(--line);background:var(--sel);border-radius:14px;padding:8px 16px;font-size:18px;font-weight:700;margin:4px}
.go{border:0;background:var(--ok);color:#fff;border-radius:14px;padding:10px 18px;font-size:18px;font-weight:700;margin:6px 4px}
.go.alt{background:var(--mut)}
.tiles{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.slot{width:42px;height:48px;border:0;border-bottom:3px solid var(--mut);background:transparent;font-size:28px;font-weight:700}
.slot.g{color:var(--ok)}
.t{width:46px;height:50px;border-radius:12px;border:2px solid var(--line);background:var(--sel);font-size:26px;font-weight:700}
.t:disabled{opacity:.2;cursor:default}
.tiles.bad{animation:sh .4s}
.wordline{font-size:44px;font-weight:700;letter-spacing:6px;margin:6px 0}
.wordline .q{color:var(--bad);border-bottom:4px solid var(--bad)}
.opt{width:64px;height:64px;border-radius:16px;border:2px solid var(--line);background:var(--sel);font-size:32px;font-weight:700}
.opt.bad{animation:sh .4s;border-color:var(--bad)}
.inp{width:80%;max-width:260px;font-size:30px;text-align:center;border:0;border-bottom:3px solid var(--mut);background:transparent;color:var(--ink);font-family:inherit;outline:none;margin:8px 0}
.win{font-size:22px;font-weight:700;margin:8px;color:var(--ok)}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mg>div{display:flex;flex-direction:column;gap:8px}
.pic,.wd{height:56px;border:2px solid var(--line);border-radius:12px;background:var(--card)}
.pic{font-size:26px;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.pic svg{height:40px;width:auto}
.pic img{max-height:46px;max-width:88%;width:auto;height:auto;border-radius:6px}
.big img{max-height:100px;max-width:70%;width:auto;height:auto;border-radius:10px}.pic .dot{width:30px;height:30px}
.wd{font-size:20px;font-weight:700}
.pic.sel{background:var(--sel);border-color:var(--ink)}
.pic.ok,.wd.ok{border-color:var(--ok);opacity:.5}
.wd.bad{border-color:var(--bad);animation:sh .4s}
@media (prefers-reduced-motion:no-preference){.me.hop{animation:hop .7s}}
.climb{display:flex;align-items:flex-end;gap:4px;height:46px;padding-top:30px;margin-bottom:6px}
.stp{flex:1;position:relative;background:var(--line);border-radius:6px 6px 0 0}
.stp.on{background:var(--ok)}
.me{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:24px;line-height:1;font-style:normal}
.fx{position:fixed;inset:0;pointer-events:none;z-index:9;overflow:hidden}
.pill{position:absolute;top:26%;left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;font-size:26px;font-weight:700;padding:10px 22px;border-radius:30px;white-space:nowrap;animation:pop 1s ease-out forwards}
.pill.bigp{font-size:23px;background:#e08a00;animation-duration:3.4s}
.pt{position:absolute;top:30%;left:50%;font-size:26px;font-style:normal;animation:fly 1s ease-out forwards}
.cf{position:absolute;top:-40px;font-size:28px;font-style:normal;animation:fall linear forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.5)}15%{opacity:1;transform:translate(-50%,0) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-24px)}}
@keyframes fly{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.2);opacity:0}}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
@keyframes hop{30%{transform:translate(-50%,-16px) scale(1.25)}60%{transform:translate(-50%,-4px)}}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head>

 [['Egg',im('egg')],['Seed',im('seed')],['Flower',im('flower')],['Sister',im('sister')],['Brother',im('brother')]]]},
Splash:{c:['#FAC775','#412402'],g:[
 [['Pencil',im('pencil')],['Glue',im('glue')],['Crayon',im('crayon')],['Run',im('run')],['Cut',im('cut')],['Hat',im('hat')],['Map',im('map')],['Jam',im('jam')]],
 [['Happy',im('happy')],['Sad',im('sad')],['Win',im('win')]],
 [['Cup',im('cup')],['Gum',im('gum')]],
 [['Pasta',im('pasta')],['Rice',im('rice')]]]},
Bricks:{c:['#9FE1CB','#04342C'],g:[
 [['Mug',im('mug')],['Pan',im('pan')],['Bed',im('bed')],['Sit',im('sit')]]]}
};
const EX=['Match','Listen','Missing','Cover','Quiz'];
const chunk=(a,n)=>{const r=[];for(let i=0;i<a.length;i+=n)r.push(a.slice(i,i+n));return r};
const parts=b=>B[b].g.flatMap(g=>chunk(g,5));
const sh=a=>[...a].sort(()=>Math.random()-.5);
const der=n=>{let a;for(let t=0;t<300;t++){a=sh([...Array(n).keys()]);if(a.every((v,i)=>Math.abs(v-i)>1))return a}do{a=sh([...Array(n).keys()])}while(n>1&&a.some((v,i)=>v===i));return a};
const app=document.getElementById('app');
let S={b:'Stem',p:0,x:0},E={};
const W=()=>parts(S.b)[S.p];
function say(w){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
function auto(){const w=W();if(E.i===undefined||E.i>=w.length)return;if(S.x===1||S.x===2)say(w[E.i][0]);if(S.x===4)say(w[E.ord[E.i]][0])}
function init(){const w=W();E={};
 if(S.x===0)E={o:der(w.length),sel:null,done:{},bad:null};
 else if(S.x===4)E={ord:sh([...w.keys()]),i:0,sc:0,fb:null};
 else{E={i:0};prep()}}
function prep(){const w=W();if(E.i>=w.length)return;const t=w[E.i][0].toLowerCase();
 if(S.x===1){let a,k=0;do{a=sh([...t]);k++}while(a.join('')===t&&k<30);E.L=a;E.pk=[];E.ok=0;E.bad=0}
 if(S.x===2){const m=Math.floor(Math.random()*t.length);const al='abcdefghilmnoprstuw'.split('').filter(c=>c!==t[m]);E.m=m;E.opts=sh([t[m],...sh(al).slice(0,2)]);E.ok=0;E.bad=null}
 if(S.x===3){E.st='look';E.fb=null}}
function nav(k,v){if(k==='b'){S.b=v;S.p=0}else if(k==='p')S.p=v;else S.x=v;init();render();auto()}
function nx(){E.i++;prep();render();auto()}
const cnt=()=>S.x===0?Object.keys(E.done).length:S.x===4?E.sc:E.i+((S.x===3?E.fb==='ok':E.ok)?1:0);
const prog=()=>{const n=W().length,c=Math.min(cnt(),n);let h='<div class="climb">';
 for(let i=0;i<=n;i++){const t=i===n;h+=`<div class="stp${i<=c?' on':''}" style="height:${14+i*30/n}px">${i===c?`<b class="me${E.hop?' hop':''}">${t?'🎉':'🐥'}</b>`:''}${t&&i!==c?'<b class="me">🏆</b>':''}</div>`}
 return h+'</div>'};
const AC=typeof AudioContext!=='undefined'?AudioContext:typeof webkitAudioContext!=='undefined'?webkitAudioContext:null;let AX=null;
function tone(f,t,d){try{AX=AX||new AC();const o=AX.createOscillator(),g=AX.createGain();o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(AX.destination);const s=AX.currentTime+t;g.gain.setValueAtTime(.18,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d)}catch(e){}}
function cheer(big,msg){
 const L=['Great!','Super!','Wow!','Yes!','Well done!','Amazing!','Bravo!'];
 if(big){[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.13,.4));setTimeout(()=>say('Well done!'),750)}else{tone(660,0,.14);tone(880,.11,.22)}
 const calm=typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion:reduce)').matches;
 let h=`<div class="pill${big?' bigp':''}">${msg||(big?'🏆 You reached the top! 🎉':L[Math.floor(Math.random()*L.length)])}</div>`;
 if(!calm){const em=big?['🎉','⭐','🎊','✨','🌟','🎈','🏆']:['⭐','🌟','✨'];
  for(let i=0;i<(big?24:10);i++){const a=Math.random()*6.283,r=(big?110:70)+Math.random()*(big?120:60);h+=`<i class="pt" style="--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r}px">${em[i%em.length]}</i>`}
  if(big)for(let i=0;i<40;i++)h+=`<i class="cf" style="left:${Math.random()*96}%;animation-delay:${Math.random()*1.4}s;animation-duration:${2+Math.random()*1.5}s">${em[i%em.length]}</i>`}
 const d=document.createElement('div');d.className='fx';d.innerHTML=h;document.body.appendChild(d);setTimeout(()=>d.remove(),big?4200:1100)}
function good(){E.hop=1;cheer(S.x!==4&&cnt()>=W().length)}
const fin=m=>`<div class="win">${m||'🎉 Great job!'}</div><div class="row c">${S.p<parts(S.b).length-1?`<button class="go" onclick="nav('p',S.p+1)">Next part ➜</button>`:''}<button class="go alt" onclick="nav('x',S.x)">↻ Again</button></div>`;
/* match */
function pick(i){if(E.done[i])return;E.sel=i;render()}
function ans(j){if(E.sel===null||E.done[E.o[j]])return;
 if(E.o[j]===E.sel){E.done[E.sel]=1;good();E.sel=null}else{E.bad=j;setTimeout(()=>{E.bad=null;render()},500)}render()}
/* listen and build */
function tl(k){if(E.ok||E.bad||E.pk.includes(k))return;const t=W()[E.i][0].toLowerCase();E.pk.push(k);
 if(E.pk.length===t.length){if(E.pk.map(x=>E.L[x]).join('')===t){E.ok=1;good();say(W()[E.i][0])}else{E.bad=1;render();setTimeout(()=>{E.pk=[];E.bad=0;render()},700);return}}render()}
function unp(k){if(E.ok||E.bad)return;E.pk=E.pk.slice(0,k);render()}
/* missing letter */
function mp(k){if(E.ok)return;const t=W()[E.i][0].toLowerCase();
 if(E.opts[k]===t[E.m]){E.ok=1;good();say(W()[E.i][0])}else{E.bad=k;setTimeout(()=>{E.bad=null;render()},500)}render()}
/* look cover write */
function chk(){const v=document.getElementById('inp').value.trim().toLowerCase();
 if(v===W()[E.i][0].toLowerCase()){E.fb='ok';good();render();setTimeout(()=>{E.i++;prep();render()},900)}
 else{E.fb='bad';render();setTimeout(()=>{E.fb=null;E.st='look';render()},800)}}
/* dictation quiz */
function qz(){const n=W().length,w=W()[E.ord[E.i]][0],v=document.getElementById('inp').value.trim().toLowerCase(),ok=v===w.toLowerCase();
 if(ok){E.sc++;good()}E.fb={ok};render();setTimeout(()=>{E.fb=null;E.i++;render();if(E.i>=n)cheer(true,E.sc===n?null:`⭐ ${E.sc} / ${n}  Great effort!`);else auto()},ok?900:1800)}
const X=[
()=>{const w=W(),n=w.length,md=Object.keys(E.done).length;
 return `${prog()}<p>Tap a picture, then its word. <b>${md}/${n}</b></p><div class="mg"><div>`
 +w.map((a,i)=>`<button class="pic${E.sel===i?' sel':''}${E.done[i]?' ok':''}" onclick="pick(${i})">${a[1]}</button>`).join('')
 +'</div><div>'+E.o.map((i,j)=>`<button class="wd${E.done[i]?' ok':''}${E.bad===j?' bad':''}" onclick="ans(${j})">${w[i][0]}</button>`).join('')+'</div></div>'+(md===n?fin():'')},
()=>{const w=W();if(E.i>=w.length)return fin();const [wd,p]=w[E.i],t=wd.toLowerCase();
 const slots=[...t].map((_,k)=>`<button class="slot${E.ok?' g':''}" onclick="unp(${k})">${E.pk[k]!==undefined?E.L[E.pk[k]]:''}</button>`).join('');
 const tiles=E.L.map((l,k)=>`<button class="t" ${E.pk.includes(k)||E.ok?'disabled':''} onclick="tl(${k})">${l}</button>`).join('');
 return `${prog()}<div class="big">${p}</div><button class="spk" onclick="say('${wd}')">🔊 Listen</button><div class="tiles${E.bad?' bad':''}">${slots}</div><div class="tiles">${tiles}</div>${E.ok?'<button class="go" onclick="nx()">Next ➜</button>':''}`},
()=>{const w=W();if(E.i>=w.length)return fin();const [wd,p]=w[E.i],t=wd.toLowerCase();
 const shown=[...t].map((c,k)=>k===E.m?(E.ok?`<span class="g">${c}</span>`:'<span class="q">_</span>'):c).join('');
 return `${prog()}<div class="big">${p}</div><button class="spk" onclick="say('${wd}')">🔊 Listen</button><div class="wordline">${shown}</div><div class="row c">${E.opts.map((c,k)=>`<button class="opt${E.bad===k?' bad':''}" ${E.ok?'disabled':''} onclick="mp(${k})">${c}</button>`).join('')}</div>${E.ok?'<button class="go" onclick="nx()">Next ➜</button>':''}`},
()=>{const w=W();if(E.i>=w.length)return fin();const [wd,p]=w[E.i];
 if(E.fb==='ok')return `${prog()}<div class="big">${p}</div><div class="wordbig g">${wd}</div><div class="win">✅</div>`;
 if(E.st==='look')return `${prog()}<div class="big">${p}</div><div class="wordbig">${wd}</div><p>Look carefully and say the letters.</p><div class="row c"><button class="spk" onclick="say('${wd}')">🔊</button><button class="go" onclick="E.st='write';render()">Cover it 🙈</button></div>`;
 return `${prog()}<div class="big">${p}</div><input id="inp" class="inp" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="write it">${E.fb==='bad'?'<div class="win r">Look again</div>':''}<div class="row c"><button class="go" onclick="chk()">Check ✔</button><button class="go alt" onclick="E.st='look';render()">Peek 👀</button></div>`},
()=>{const w=W(),n=w.length;if(E.i>=n)return fin(`⭐ ${E.sc} / ${n}`);const [wd,p]=w[E.ord[E.i]];
 if(E.fb)return `${prog()}<div class="big">${p}</div><div class="wordbig ${E.fb.ok?'g':'r'}">${wd}</div><div class="win ${E.fb.ok?'':'r'}">${E.fb.ok?'✅':'Remember it'}</div>`;
 return `${prog()}<div class="big">❓</div><button class="spk" onclick="say('${wd}')">🔊 Listen</button><input id="inp" class="inp" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="write the word"><div class="row c"><button class="go" onclick="qz()">Check ✔</button></div>`}
];
function render(){
 const bk=B[S.b],ps=parts(S.b),w=W();
 let h='<div class="row">'+Object.keys(B).map(k=>`<button class="bk${k===S.b?' on':''}" style="background:${B[k].c[0]};color:${B[k].c[1]}" onclick="nav('b','${k}')">${k}</button>`).join('')+'</div>';
 h+='<div class="row">'+ps.map((_,i)=>`<button class="chip${i===S.p?' on':''}" onclick="nav('p',${i})">Part ${i+1}</button>`).join('')+'</div>';
 h+=`<div class="pv" style="background:${bk.c[0]};color:${bk.c[1]}">${w.map(a=>a[0]).join(' · ')}</div>`;
 h+='<div class="row">'+EX.map((e,i)=>`<button class="chip${i===S.x?' on':''}" onclick="nav('x',${i})">${e}</button>`).join('')+'</div>';
 h+='<section class="st">'+X[S.x]()+'</section>';
 app.innerHTML=h;E.hop=0;
 const f=document.getElementById('inp');if(f&&E.st!=='look')f.focus()}
init();render();
</script></body></html>
