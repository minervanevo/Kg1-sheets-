<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ألعاب الحروف</title>
<style>
:root{--bg:#fff8f0;--card:#fff;--ink:#222;--pink:#d6336c;--blue:#2b78c9;--ok:#2f9e44;--bad:#e03131;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1a22;--card:#2b2631;--ink:#f3ecf5}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'DejaVu Sans',Tahoma,Arial,sans-serif}
.top{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-weight:bold}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:6px 10px}
button{font:inherit;border:0;border-radius:14px;background:var(--card);color:var(--ink);box-shadow:0 2px 0 #0002;padding:10px 14px;font-size:18px;cursor:pointer}
button.on{background:var(--pink);color:#fff}.L{font-size:30px;min-width:54px}
.card{background:var(--card);border-radius:16px;padding:8px;text-align:center;box-shadow:0 2px 0 #0002;min-width:96px}
.card img{width:84px;height:84px;object-fit:contain;display:block;margin:0 auto 4px}
.big{font-size:64px;font-weight:bold;color:var(--pink);text-align:center}.w{font-size:24px;font-weight:bold}
.ok{outline:4px solid var(--ok)}.bad{outline:4px solid var(--bad);animation:s .3s}
@keyframes s{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
.box{width:52px;height:56px;border:3px solid var(--ink);border-radius:8px;background:var(--card);padding:0}
.msg{text-align:center;font-size:22px;min-height:34px;font-weight:bold}.small{font-size:13px;opacity:.7;text-align:center;padding:6px}
</style></head><body>
