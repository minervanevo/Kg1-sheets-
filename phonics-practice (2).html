<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phonics practice</title>
<style>
:root{--bg:#EAF4FF;--ink:#1B2A49;--card:#fff;--s:#E8505B;--a:#2F6FDE;--t:#1E9E6A;--i:#F08A24;--n:#7B4FD1;--p:#D6338A;--ok:#1E9E6A;--no:#D64545}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Comic Sans MS","Trebuchet MS",sans-serif;padding:12px;max-width:560px;margin:auto}
h1{font-size:22px;margin:4px 0 10px;text-align:center}
.row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
.pill{border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:15px;cursor:pointer}
.pill.on{background:var(--ink);color:#fff}
.strip{text-align:center;margin:4px 0 10px}
.strip b{font-size:26px;display:block;line-height:1.1}
.card{background:var(--card);border-radius:20px;padding:18px 14px;min-height:300px;text-align:center;border:2px solid var(--ink)}
.q{font-size:18px;margin:0 0 10px}
.big{font-size:84px;line-height:1.1}
.word{font-size:56px;font-weight:800;letter-spacing:2px;margin:6px 0 12px}
.opts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.opt{min-width:84px;min-height:64px;font:inherit;font-size:32px;font-weight:800;border:3px solid var(--ink);background:#fff;border-radius:16px;cursor:pointer;padding:4px 14px}
.opt.right{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{background:var(--no);color:#fff;border-color:var(--no);animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.act{margin-top:14px;font:inherit;font-size:20px;font-weight:700;background:var(--ink);color:#fff;border:0;border-radius:14px;padding:10px 22px;cursor:pointer}
.act.alt{background:#fff;color:var(--ink);border:2px solid var(--ink);font-size:16px;margin-left:6px}
.boxes{display:flex;justify-content:center;gap:14px;margin:18px 0 6px;transition:gap .5s}
.boxes.join{gap:0}
.bx{font-size:68px;font-weight:800;min-width:56px;border-radius:12px;padding:0 6px;transition:background .2s}
.bx.lit{background:#FFE08A}
.msg{min-height:26px;font-size:18px;margin-top:8px;font-weight:700}
.stars{text-align:center;margin-top:8px;font-size:18px}
.lc{display:inline-block;vertical-align:top;margin:0 8px;text-align:center}
.lc small{display:block;font-size:12px;font-weight:600;letter-spacing:0;line-height:1.25;color:#55627f}
.target{width:76px;height:76px;margin:0 auto 6px;border:4px solid;border-radius:50%;font-size:52px;font-weight:800;line-height:68px}
.fr{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px}
.fb{font:inherit;font-size:46px;font-weight:800;width:62px;height:72px;background:#fff;border:3px solid var(--ink);border-radius:12px;cursor:pointer;padding:0}
.fb.right{background:var(--ok);border-color:var(--ok)}.fb.wrong{background:#fde2e2;border-color:var(--no);animation:sh .3s}
.go{color:var(--ok);font-size:24px}.stop{color:var(--no);font-size:24px}
</style></head><body>
<h1>Phonics practice</h1>
<div class="row" id="wk"></div>
<div class="strip" id="strip"></div>
<div class="row" id="modes"></div>
<div class="card" id="card"></div>
<div class="stars" id="stars"></div>

/* ===== EACH WEEK: add one new block here =====
   letters: new letters; items: [word, emoji]; blend: new decodable words; sent: new sentences */
var WEEKS=[
 {letters:['s','a'],items:[['sun','☀️'],['spider','🕷️'],['snail','🐌'],['ant','🐜'],['arrow','🏹'],['apple','🍎']],blend:['as'],sent:['As.']},
 {letters:['t','i'],items:[['tent','⛺'],['turtle','🐢'],['teddybear','🧸'],['ink','🖋️'],['igloo','🧊'],['insect','🐛']],blend:['is','at','it','sat','sit'],sent:['It sat.','Sit.','As it is.']},
 {letters:['n','p'],items:[['nest','🪹'],['net','🥅'],['neck','🧣'],['pen','🖊️'],['pineapple','🍍'],['peach','🍑']],blend:['an','in','tap','tip','pin','pan','nap','nip','sip','tin','pat','pit','ant'],sent:['Pat sat.','Tap it.','A pin in a tin.','Sit in a tin.','Sip it.','Nip it.']}
];
function upto(k,wk){var r=[];for(var i=0;i<wk;i++)r=r.concat(WEEKS[i][k]);return r}
function LETS(wk){return upto('letters',wk)}
function ITEMSW(wk){return upto('items',wk)}
function BLW(wk){return upto('blend',wk)}
function SENTW(wk){return upto('sent',wk)}
function pic(it,px){return IMG[it[0]]?'<img src="'+IMG[it[0]]+'" style="height:'+(px*.9)+'px;max-width:90%;border-radius:12px" alt="">':'<div style="font-size:'+px+'px;line-height:1.1">'+it[1]+'</div>'}
var wk=WEEKS.length,mode='first',stars=0,cur=null,step=0;
var MODES=[['first','First sound'],['blend','Blend'],['read','Read'],['where','Where?']];
function $(i){return document.getElementById(i)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function say(w){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.75;speechSynthesis.speak(u)}catch(e){}}
function col(l){return 'var('+COL[l]+')'}
function head(){
 $('wk').innerHTML=WEEKS.map(function(_,i){var w=i+1;return '<button class="pill'+(w==wk?' on':'')+'" onclick="setWk('+w+')">Week '+w+'</button>'}).join('');
 var its=ITEMSW(wk);
 $('strip').innerHTML=LETS(wk).map(function(l){
  var ws=its.filter(function(x){return x[0][0]==l}).map(function(x){return x[0]}).join('<br>');
  return '<div class="lc"><b style="color:'+col(l)+'">'+l+'</b><small>'+ws+'</small></div>'}).join('');
 $('modes').innerHTML=MODES.map(function(m){return '<button class="pill'+(m[0]==mode?' on':'')+'" onclick="setMode(\''+m[0]+'\')">'+m[1]+'</button>'}).join('');
 $('stars').textContent=stars?'⭐'.repeat(Math.min(stars,20))+(stars>20?' +'+(stars-20):''):'';
}
function setWk(w){wk=w;go()}
function setMode(m){mode=m;go()}
function win(){stars++;$('stars').textContent='⭐'.repeat(Math.min(stars,20))+(stars>20?' +'+(stars-20):'')}
function go(){head();step=0;({first:first,blend:blend,read:read,where:where})[mode]()}
function opts(list){return '<div class="opts">'+list.map(function(o){return '<button class="opt" data-o="'+o+'">'+o+'</button>'}).join('')+'</div>'}
function wire(right,fn){
 var bs=document.querySelectorAll('.opt');
 for(var i=0;i<bs.length;i++)bs[i].onclick=function(){
  if(this.dataset.o==right){this.className=this.className.replace(/ ?(right|wrong)/g,'')+' right';win();$('msg').textContent='Yes! 🎉';setTimeout(fn,800)}
  else{this.className=this.className.replace(/ ?(right|wrong)/g,'')+' wrong';$('msg').textContent='Try again'}};
}
function first(){
 var it=pick(ITEMSW(wk));var right=it[0][0],L=LETS(wk);
 var o=shuffle([right].concat(shuffle(L.filter(function(l){return l!=right})).slice(0,2)));
 $('card').innerHTML='<p class="q">What is the first sound?</p>'+pic(it,96)+'<br><button class="act alt" onclick="say(\''+it[0]+'\')" style="margin:8px 0 0">🔊 Hear</button>'+opts(o)+'<div class="msg" id="msg"></div>';
 wire(right,first);
}
function blend(){
 var w=pick(BLW(wk));cur=w;step=0;
 $('card').innerHTML='<p class="q">Say each sound. Then blend!</p><div class="boxes" id="bx">'+w.split('').map(function(l,i){return '<span class="bx" id="b'+i+'" style="color:'+col(l)+'">'+l+'</span>'}).join('')+'</div><div class="msg" id="msg"></div><button class="act" id="nx" onclick="bstep()">Next sound</button>';
}
function bstep(){
 var n=cur.length;
 if(step<n){for(var i=0;i<n;i++)$('b'+i).className='bx'+(i==step?' lit':'');step++;if(step==n)$('nx').textContent='Blend it!'}
 else if(step==n){for(var i=0;i<n;i++)$('b'+i).className='bx';$('bx').className='boxes join';$('msg').textContent=cur;say(cur);win();step++;$('nx').textContent='Next word'}
 else blend();
}
function read(){
 var w=pick(BLW(wk).concat(SENTW(wk)));var sp=w.indexOf(' ')>-1;
 $('card').innerHTML='<p class="q">Read it by yourself</p><div class="word" style="font-size:'+(sp?40:64)+'px">'+w.split('').map(function(l){return COL[l.toLowerCase()]?'<span style="color:'+col(l.toLowerCase())+'">'+l+'</span>':l}).join('')+'</div><button class="act" id="rd">I read it</button><div class="msg" id="msg"></div>';
 $('rd').onclick=function(){say(w);win();$('msg').textContent='Did you say it right? 👍';$('rd').textContent='Next';$('rd').onclick=read};
}
function where(){
 var it,l,tries=0;
 while(tries++<80){it=pick(ITEMSW(wk));var cs=LETS(wk).filter(function(c){return it[0].split(c).length==2});if(cs.length){l=pick(cs);break}}
 var w=it[0],p=w.indexOf(l),right=p==0?'Beginning':(p==w.length-1?'End':'Middle');
 var wh=w.split('').map(function(c){return c==l?'<span style="color:'+col(l)+';text-decoration:underline">'+c+'</span>':c}).join('');
 $('card').innerHTML='<p class="q">Where is the sound <b style="color:'+col(l)+'">'+l+'</b>?</p>'+pic(it,70)+'<div class="word" style="font-size:44px;margin:4px 0 0">'+wh+'</div>'+opts(['Beginning','Middle','End']).replace(/class="opt"/g,'class="opt" style="font-size:20px"')+'<div class="msg" id="msg"></div>';
 wire(right,where);
}
go();
</script></body></html>
