<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Splash Revision 4/11/2026</title>
<style>
:root{--bg:#fff8ec;--card:#fff;--ink:#2b2b3a;--a:#ff7a59;--b:#4a90e2;--ok:#4caf50;--bad:#e53935;--line:#f0d9b5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1b2a;--card:#2a2840;--ink:#f3f0ff;--line:#444066}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;padding:10px 12px 20px;max-width:520px;margin:0 auto}
h1{font-size:17px;text-align:center;margin:4px 0 8px}
.tabs,.pills{display:flex;gap:6px;margin:6px 0}
.tabs button{flex:1;font-size:18px;padding:12px 4px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:700}
.tabs button.on{background:var(--a);color:#fff;border-color:var(--a)}
.pills{flex-wrap:wrap}.pills button{font-size:14px;padding:8px 12px;border-radius:20px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.pills button.on{background:var(--b);color:#fff;border-color:var(--b)}
.strip{display:flex;flex-wrap:wrap;gap:5px;background:var(--card);border:2px dashed var(--line);border-radius:12px;padding:8px;margin:6px 0;font-weight:700;font-size:14px}
.strip span{padding:2px 8px;border-radius:10px;background:var(--bg)}
hr{border:0;border-top:3px solid var(--line);margin:10px 0}
.lbl{font-size:13px;opacity:.7;text-align:center;margin:0 0 4px}
.card{background:var(--card);border-radius:18px;padding:12px;border:2px solid var(--line);min-height:300px;text-align:center}
.q{font-size:15px;margin:2px 0 8px;font-weight:700}
.pic{font-size:64px;line-height:1.1}.pic.s{font-size:44px}
.opts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.o{font-size:24px;font-weight:700;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);min-width:70px}
.o.good{background:var(--ok);color:#fff;border-color:var(--ok)}.o.bad{background:var(--bad);color:#fff;border-color:var(--bad)}.o.sel{border-color:var(--b);box-shadow:0 0 0 3px var(--b)}.o.done{background:var(--ok);color:#fff;opacity:.55}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cols .o{width:100%;font-size:20px;padding:8px 4px}.cols .o.p{font-size:34px;padding:2px}
.slots{display:flex;gap:6px;justify-content:center;margin:10px 0;min-height:52px}.slot{width:46px;height:50px;border-bottom:4px solid var(--b);font-size:30px;font-weight:700}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.mem .o{min-width:0;padding:6px 2px;height:70px;font-size:15px}.mem .o.pc{font-size:32px}
.next{margin-top:12px;font-size:16px;padding:10px 20px;border-radius:20px;border:0;background:var(--a);color:#fff;font-weight:700}
.im{height:1em;width:auto;max-width:100%;vertical-align:middle}.pic .im{height:96px}.cols .o.p .im{height:48px}.mem .pc .im{height:48px}.strip .im{height:22px}
#climb{background:linear-gradient(#bfe6ff,#e9f7ff);border:2px solid var(--line);border-radius:18px;padding:6px 8px 0;margin:8px 0;position:relative;overflow:hidden;min-height:150px}
#climb:empty{display:none}
.cl-top{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;color:#24407a}
.cl-top button{border:0;background:#ffffffaa;border-radius:12px;font-size:16px;padding:2px 8px}
.cl-stage{position:relative;height:120px;margin-top:2px}
.cl-stage:after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:#6ab04c;border-radius:3px}
.cl-step{position:absolute;bottom:0;border-radius:6px 6px 0 0;box-shadow:inset 0 3px 0 #ffffff66}
.cl-ch{position:absolute;text-align:center;font-size:30px;line-height:1;transition:left .5s ease,bottom .55s cubic-bezier(.3,1.7,.5,1);z-index:3;animation:idle 1.4s ease-in-out infinite}
.cl-goal{position:absolute;text-align:center;font-size:30px;line-height:1;animation:glow 1.6s ease-in-out infinite}
.cl-ch.shake{animation:shk .45s}.cl-ch.spin{animation:spn .9s}
.cl-p{position:absolute;font-size:18px;pointer-events:none;z-index:5;animation:fly .75s ease-out forwards}
.cl-bub{position:absolute;background:#fff;border:2px solid #24407a;border-radius:12px;padding:1px 8px;font-size:13px;font-weight:700;color:#24407a;pointer-events:none;z-index:6;white-space:nowrap;animation:bub 1s ease-out forwards}
.cl-ban{position:absolute;left:0;right:0;top:34px;text-align:center;font-size:22px;font-weight:800;color:#c2255c;text-shadow:0 2px 0 #fff;z-index:7;animation:ban 2.4s ease-out forwards;pointer-events:none}
.conf{position:fixed;top:-20px;z-index:60;pointer-events:none;font-size:22px;animation:fall 2.8s linear forwards}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes glow{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes spn{0%{transform:rotate(0) scale(1)}60%{transform:rotate(360deg) scale(1.5)}100%{transform:rotate(360deg) scale(1)}}
@keyframes fly{0%{opacity:1;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3)}}
@keyframes bub{0%{opacity:0;transform:translateY(6px)}15%{opacity:1}100%{opacity:0;transform:translateY(-26px)}}
@keyframes ban{0%{opacity:0;transform:scale(.5)}15%{opacity:1;transform:scale(1.1)}80%{opacity:1}100%{opacity:0}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.sc{font-size:13px;margin-top:8px;opacity:.7}
</style></head><body>

  const col=['#ff6b6b','#ffa94d','#ffd43b','#69db7c','#4dabf7','#9775fa','#f783ac'],W=100/(n+1);
  let t='<div class="cl-top"><span id="cl-sc">⭐ 0 / '+n+'</span><button onclick="climb.tog()" id="cl-snd">'+(this.snd?'🔊':'🔇')+'</button></div><div class="cl-stage">';
  for(let k=1;k<=n;k++)t+='<div class="cl-step" style="left:'+k*W+'%;width:'+W+'%;height:'+(6+k*this.u)+'px;background:'+col[(k-1)%7]+'"></div>';
  t+='<div class="cl-goal" style="left:'+n*W+'%;width:'+W+'%;bottom:'+(6+n*this.u+36)+'px">'+this.goal+'</div><div class="cl-ch" id="cl-ch" style="width:'+W+'%">'+this.ch+'</div></div>';
  $('climb').innerHTML=t;this.place()},
 place(){const e=$('cl-ch');if(!e)return;const W=100/(this.n+1);e.style.left=this.s*W+'%';e.style.bottom=(6+this.s*this.u)+'px';const sc=$('cl-sc');if(sc)sc.textContent='⭐ '+this.s+' / '+this.n},
 tog(){this.snd=!this.snd;const b=$('cl-snd');if(b)b.textContent=this.snd?'🔊':'🔇'},
 tone(f,d,t0){if(!this.snd)return;try{this.ac=this.ac||new (window.AudioContext||window.webkitAudioContext)();const a=this.ac,o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,a.currentTime+t0);g.gain.exponentialRampToValueAtTime(.25,a.currentTime+t0+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t0+d);o.connect(g);g.connect(a.destination);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+d+.05)}catch(e){}},
 pos(){const e=$('cl-ch');return e?e.style.left:'0%'},
 pop(txt){const st=document.querySelector('.cl-stage');if(!st)return;const b=document.createElement('div');b.className='cl-bub';b.textContent=txt;b.style.left='calc('+this.pos()+' - 6px)';b.style.bottom=(6+this.s*this.u+38)+'px';st.appendChild(b);setTimeout(()=>b.remove(),1000)},
 burst(list,n){const st=document.querySelector('.cl-stage');if(!st)return;for(let i=0;i<n;i++){const p=document.createElement('span');p.className='cl-p';p.textContent=list[i%list.length];const a=Math.random()*6.28,r=30+Math.random()*34;p.style.setProperty('--dx',Math.cos(a)*r+'px');p.style.setProperty('--dy',(Math.sin(a)*r-20)+'px');p.style.left='calc('+this.pos()+' + 8px)';p.style.bottom=(6+this.s*this.u+10)+'px';st.appendChild(p);setTimeout(()=>p.remove(),800)}},
 up(){if(this.s<this.n)this.s++;this.place();const W=['Yay!','Great!','Super!','Wow!','Yes!','Well done!','Hooray!'];
  setTimeout(()=>{this.burst(['⭐','✨','🎉','💫','🎈'],10);this.pop(W[Math.random()*W.length|0])},320);
  this.tone(660,.14,0);this.tone(880,.16,.12);this.tone(1175,.22,.26)},
 oops(){const e=$('cl-ch');if(!e)return;e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake');this.pop('Try again!');this.tone(260,.25,0)},
 win(perfect){while(this.s<this.n)this.s++;this.place();const e=$('cl-ch');
  setTimeout(()=>{if(e){e.classList.remove('shake');e.classList.add('spin')}this.burst(['🎉','⭐','✨','🎊','💖','🌟'],18);
   const st=document.querySelector('.cl-stage'),b=document.createElement('div');b.className='cl-ban';b.textContent=perfect?'🏆 You did it! 🏆':'🎉 Well done! 🎉';$('climb').appendChild(b);setTimeout(()=>b.remove(),2500);
   const em=['🎉','⭐','🎊','✨','💖','🌟','🎈'],cc=['#ff6b6b','#ffd43b','#69db7c','#4dabf7','#f783ac','#9775fa'];
   for(let i=0;i<(perfect?46:26);i++){const c=document.createElement('span');c.className='conf';c.textContent=i%3?em[i%em.length]:'■';if(!(i%3))c.style.color=cc[i%6];c.style.left=Math.random()*100+'vw';c.style.animationDelay=Math.random()*.8+'s';c.style.fontSize=(16+Math.random()*16)+'px';document.body.appendChild(c);setTimeout(()=>c.remove(),3800)}
   say(perfect?'You did it! Great job!':'Well done!')},450);
  [523,659,784,1047,784,1047].forEach((f,i)=>this.tone(f,.2,i*.14))}
};
/* Match: word and picture never opposite or next to each other */
function match(){
 const L=sh(words()),n=L.length,P=L.map((_,i)=>L[(i+2)%n]);let sel=null,done=0;climb.init(n);
 $('game').innerHTML=`<p class="q">Tap a word, then tap its picture</p><div class="cols" id="m"></div><p class="sc" id="sc"></p>`;
 const m=$('m');
 for(let i=0;i<n;i++){m.insertAdjacentHTML('beforeend',`<button class="o w" data-w="${L[i]}">${L[i]}</button><button class="o p" data-p="${P[i]}">${E[P[i]]}</button>`)}
 m.onclick=e=>{const b=e.target.closest('button');if(!b||b.classList.contains('done'))return;
  if(b.dataset.w){m.querySelectorAll('.w').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b;say(b.dataset.w);return}
  if(b.dataset.p)say(b.dataset.p);
  if(!sel)return;
  if(sel.dataset.w==b.dataset.p){sel.classList.remove('sel');sel.classList.add('done');b.classList.add('done');sel=null;climb.up();if(++done==n){climb.win(true);$('sc').innerHTML='🎉 Great job!'+nextBtn()}}
  else{b.classList.add('bad');climb.oops();setTimeout(()=>b.classList.remove('bad'),500)}}
}
/* generic quiz runner */
function quiz(items,render){let i=0,ok=0;const g=$('game');climb.init(items.length);
 const step=()=>{if(i>=items.length){g.innerHTML=`<p class="pic">🎉</p><p class="q">${ok} / ${items.length}</p>`+nextBtn();climb.win(ok==items.length);return}
  render(items[i],g,right=>{if(right){ok++;climb.up()}else climb.oops();i++;setTimeout(step,1300)})};step()}
function opts(g,list,correct,cb,fmt){const d=document.createElement('div');d.className='opts';let lock=0;
 list.forEach(o=>{const b=document.createElement('button');b.className='o';b.innerHTML=fmt?fmt(o):o;b.onclick=()=>{if(lock)return;if(!fmt)say(o);
  if(o==correct){lock=1;b.classList.add('good');cb(true)}else{b.classList.add('bad');if(!lock){lock=1;[...d.children].forEach(x=>{if(x.dataset.c)x.classList.add('good')});cb(false)}}};
  if(o==correct)b.dataset.c=1;d.appendChild(b)});g.appendChild(d)}
function first(){
 const A='abcdefghijklmnopqrstuvwxyz';
 quiz(sh(words()),(w,g,done)=>{const c=w[0];const o=sh([c,...sh([...A].filter(x=>x!=c&&!words().some(v=>v[0]==x))).slice(0,3)]);
  g.innerHTML=`<p class="q">What is the beginning sound? (Capital and small)</p><p class="pic" onclick="say('${w}')">${E[w]}</p>`;
  opts(g,o,c,r=>{if(r)setTimeout(()=>say(w),350);done(r)},x=>x.toUpperCase()+' '+x)})}
function circle(){
 const W=words(),pool=bk=='sp'?W:W;
 quiz(sh(W),(w,g,done)=>{const other=sh(pool.filter(x=>x!=w))[0];
  g.innerHTML=`<p class="q">Look at the picture and circle the right word</p><p class="pic" onclick="say('${w}')">${E[w]}</p>`;
  opts(g,sh([w,other]),w,done)})}
function build(){
 quiz(sh(words()),(w,g,done)=>{let got='';
  g.innerHTML=`<p class="q">Tap the letters in order</p><p class="pic" onclick="say('${w}')">${E[w]}</p><div class="slots" id="sl"></div><div class="opts" id="lt"></div>`;
  const sl=$('sl'),lt=$('lt');
  const show=()=>sl.innerHTML=[...w].map((_,i)=>`<div class="slot">${got[i]||''}</div>`).join('');show();
  sh([...w]).forEach(ch=>{const b=document.createElement('button');b.className='o';b.textContent=ch;b.onclick=()=>{
   if(b.classList.contains('done'))return;
   if(ch==w[got.length]){got+=ch;b.classList.add('done');show();if(got==w){say(w);done(true)}}
   else{b.classList.add('bad');setTimeout(()=>b.classList.remove('bad'),400)}};lt.appendChild(b)})})}
function memory(){
 const W=words(),cs=sh(W.flatMap(w=>[{w,t:'p'},{w,t:'w'}]));let open=[],done=0;climb.init(W.length);
 $('game').innerHTML=`<p class="q">Find the picture and its word</p><div class="mem" id="mm"></div><p class="sc" id="sc"></p>`;
 const m=$('mm');
 cs.forEach(c=>{const b=document.createElement('button');b.className='o';b.textContent='❓';b.onclick=()=>{
  if(open.length==2||b.classList.contains('done')||open.includes(b))return;
  b.innerHTML=c.t=='p'?E[c.w]:c.w;if(c.t=='p')b.classList.add('pc');say(c.w);open.push(b);b.c=c;
  if(open.length==2){const[x,y]=open;
   if(x.c.w==y.c.w&&x.c.t!=y.c.t){x.classList.add('done');y.classList.add('done');open=[];climb.up();if(++done==W.length){climb.win(true);$('sc').innerHTML='🎉 Great job!'+nextBtn()}}
   else setTimeout(()=>{open.forEach(z=>{z.textContent='❓';z.classList.remove('pc')});open=[]},900)}};m.appendChild(b)})}
draw();
</script></body></html>
