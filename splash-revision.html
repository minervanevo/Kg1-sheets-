.tabs,.pills{display:flex;gap:6px;margin:6px 0}

.lbl{font-size:13px;opacity:.7;text-align:center;margin:0 0 4px}

.q{font-size:15px;margin:2px 0 8px;font-weight:700}
.pic{font-size:64px;line-height:1.1}.pic.s{font-size:44px}
.opts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.o{font-size:24px;font-weight:700;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);min-width:70px}
.o.good{background:var(--ok);color:#fff;border-color:var(--ok)}.o.bad{background:var(--bad);color:#fff;border-color:var(--bad)}.o.sel{border-color:var(--b);box-shadow:0 0 0 3px var(--b)}.o.done{background:var(--ok);color:#fff;opacity:.55}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cols .o{width:100%;font-size:20px;padding:8px 4px}.cols .o.p{font-size:34px;padding:2px}
.slots{display:flex;gap:6px;justify-content:center;margin:10px 0;min-height:52px}.slot{width:46px;height:50px;border-bottom:4px solid var(--b);font-size:30px;font-weight:700}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.mem .o{min-width:0;padding:6px 2px;height:70px;font-size:15px}.mem .o.pc{font-size:32px}
.next{margin-top:12px;font-size:16px;padding:10px 20px;border-radius:20px;border:0;background:var(--a);color:#fff;font-weight:700}
.im{height:1em;width:auto;max-width:100%;vertical-align:middle}.pic .im{height:96px}.cols .o.p .im{height:48px}.mem .pc .im{height:48px}.strip .im{height:22px}
.sc{font-size:13px;margin-top:8px;opacity:.7}

const SETS={sp:[{n:'Spelling',w:['card','mug','gum','cut','pencil','cup','map']}],
rd:[{n:'Part A',w:['paintbrush','scissors','boy','girl','apple']},{n:'Part B',w:['excited','surprised','angry','card','game']}]};
const MODES={sp:['Match','First sound','Build','Circle'],rd:['Match','Circle','Memory']};
let bk='sp',pt=0,md='Match';
const $=id=>document.getElementById(id);
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
function words(){return SETS[bk][pt].w}
function draw(){
 $('tabs').innerHTML=`<button class="${bk=='sp'?'on':''}" onclick="bk='sp';pt=0;md='Match';draw()">✏️ Spelling</button><button class="${bk=='rd'?'on':''}" onclick="bk='rd';pt=0;md='Match';draw()">👀 Reading</button>`;
 $('parts').innerHTML=SETS[bk].length>1?SETS[bk].map((p,i)=>`<button class="${i==pt?'on':''}" onclick="pt=${i};draw()">${p.n}</button>`).join(''):'';
 $('strip').innerHTML=words().map(w=>`<span onclick="say('${w}')">${E[w]} ${w}</span>`).join('');
 $('modes').innerHTML=MODES[bk].map(m=>`<button class="${m==md?'on':''}" onclick="md='${m}';draw()">${m}</button>`).join('');
 ({'Match':match,'First sound':first,'Build':build,'Circle':circle,'Memory':memory})[md]();
}
function nextBtn(){return `<br><button class="next" onclick="draw()">Play again 🔄</button>`}
/* Match: word and picture never opposite or next to each other */
function match(){
 const L=sh(words()),n=L.length,P=L.map((_,i)=>L[(i+2)%n]);let sel=null,done=0;
 $('game').innerHTML=`<p class="q">Tap a word, then tap its picture</p><div class="cols" id="m"></div><p class="sc" id="sc"></p>`;
 const m=$('m');
 for(let i=0;i<n;i++){m.insertAdjacentHTML('beforeend',`<button class="o w" data-w="${L[i]}">${L[i]}</button><button class="o p" data-p="${P[i]}">${E[P[i]]}</button>`)}
 m.onclick=e=>{const b=e.target.closest('button');if(!b||b.classList.contains('done'))return;
  if(b.dataset.w){m.querySelectorAll('.w').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b;say(b.dataset.w);return}
  if(!sel)return;
  if(sel.dataset.w==b.dataset.p){sel.classList.remove('sel');sel.classList.add('done');b.classList.add('done');sel=null;if(++done==n){$('sc').innerHTML='🎉 Great job!'+nextBtn()}}
  else{b.classList.add('bad');setTimeout(()=>b.classList.remove('bad'),500)}}
}
/* generic quiz runner */
function quiz(items,render){let i=0,ok=0;const g=$('game');
 const step=()=>{if(i>=items.length){g.innerHTML=`<p class="pic">🎉</p><p class="q">${ok} / ${items.length}</p>`+nextBtn();return}
  render(items[i],g,right=>{if(right)ok++;i++;setTimeout(step,700)})};step()}
function opts(g,list,correct,cb,fmt){const d=document.createElement('div');d.className='opts';let lock=0;
 list.forEach(o=>{const b=document.createElement('button');b.className='o';b.innerHTML=fmt?fmt(o):o;b.onclick=()=>{if(lock)return;
  if(o==correct){lock=1;b.classList.add('good');cb(true)}else{b.classList.add('bad');if(!lock){lock=1;[...d.children].forEach(x=>{if(x.dataset.c)x.classList.add('good')});cb(false)}}};
  if(o==correct)b.dataset.c=1;d.appendChild(b)});g.appendChild(d)}
function first(){
 const A='abcdefghijklmnopqrstuvwxyz';
 quiz(sh(words()),(w,g,done)=>{const c=w[0];const o=sh([c,...sh([...A].filter(x=>x!=c&&!words().some(v=>v[0]==x))).slice(0,3)]);
  g.innerHTML=`<p class="q">What is the beginning sound? (Capital and small)</p><p class="pic" onclick="say('${w}')">${E[w]}</p>`;
  opts(g,o,c,done,x=>x.toUpperCase()+' '+x)})}
function circle(){
 const W=words(),pool=bk=='sp'?W:W;
 quiz(sh(W),(w,g,done)=>{const other=sh(pool.filter(x=>x!=w))[0];
  g.innerHTML=`<p class="q">Look at the picture and circle the right word</p><p class="pic" onclick="say('${w}')">${E[w]}</p>`;
  opts(g,sh([w,other]),w,done)})}
function build(){
 quiz(sh(words()),(w,g,done)=>{let got='';
  g.innerHTML=`<p class="q">Tap the letters in order</p><p class="pic" onclick="say('${w}')">${E[w]}</p><div class="slots" id="sl"></div><div class="opts" id="lt"></div>`;
  const sl=$('sl'),lt=$('lt');
  const show=()=>sl.innerHTML=[...w].map((_,i)=>`<div class="slot">${got[i]||''}</div>`).join('');show();
  sh([...w]).forEach(ch=>{const b=document.createElement('button');b.className='o';b.textContent=ch;b.onclick=()=>{
   if(b.classList.contains('done'))return;
   if(ch==w[got.length]){got+=ch;b.classList.add('done');show();if(got==w){say(w);done(true)}}
   else{b.classList.add('bad');setTimeout(()=>b.classList.remove('bad'),400)}};lt.appendChild(b)})})}
function memory(){
 const W=words(),cs=sh(W.flatMap(w=>[{w,t:'p'},{w,t:'w'}]));let open=[],done=0;
 $('game').innerHTML=`<p class="q">Find the picture and its word</p><div class="mem" id="mm"></div><p class="sc" id="sc"></p>`;
 const m=$('mm');
 cs.forEach(c=>{const b=document.createElement('button');b.className='o';b.textContent='❓';b.onclick=()=>{
  if(open.length==2||b.classList.contains('done')||open.includes(b))return;
  b.innerHTML=c.t=='p'?E[c.w]:c.w;if(c.t=='p')b.classList.add('pc');else say(c.w);open.push(b);b.c=c;
  if(open.length==2){const[x,y]=open;
   if(x.c.w==y.c.w&&x.c.t!=y.c.t){x.classList.add('done');y.classList.add('done');open=[];if(++done==W.length)$('sc').innerHTML='🎉 Great job!'+nextBtn()}
   else setTimeout(()=>{open.forEach(z=>{z.textContent='❓';z.classList.remove('pc')});open=[]},900)}};m.appendChild(b)})}
draw();
</script></body></html>
