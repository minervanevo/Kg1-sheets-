<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Read and Scan</title>
<style>
:root{--bg:#fff3f8;--card:#fff;--ink:#1d2358;--pink:#f0559a;--soft:#ffd9ea;--ok:#2fa05a;--no:#f59e0b;--sun:#ffc83d;--sky:#4aa8f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1636;--card:#2b2352;--ink:#fff;--soft:#4a2f6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1636;--card:#2b2352;--ink:#fff;--soft:#4a2f6b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Chalkboard SE","Comic Sans MS","Trebuchet MS",system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:32px;margin:6px 0 4px;text-align:center}
.sub{text-align:center;opacity:.85;margin:0 0 16px;font-size:19px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}
button{font-family:inherit}
button:focus-visible{outline:4px solid var(--sky);outline-offset:2px}
.big{border:0;border-radius:24px;padding:18px 10px;font-size:22px;font-weight:700;color:#1d2358;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;gap:6px}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.big span{font-size:42px}
.back{background:none;border:0;color:var(--ink);font-size:19px;padding:8px 4px;cursor:pointer}
.top{text-align:center;margin:6px 0 16px}
.word{font-size:58px;font-weight:800;line-height:1.1;margin-bottom:10px}
.pic{background:#fff;border-radius:22px;border:4px solid var(--soft);padding:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;aspect-ratio:1;width:100%}
.pic img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.hero{width:min(58vw,230px);margin:0 auto 12px}
.opts{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}
.opt{background:var(--card);color:var(--ink);border:4px solid var(--soft);border-radius:20px;font-size:28px;font-weight:700;padding:14px 8px;cursor:pointer}
.say{border:0;border-radius:50%;width:66px;height:66px;font-size:30px;background:var(--sun);cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.ok{border-color:var(--ok)!important;background:#d9f7e3!important;color:#14532d!important}
.no{animation:shake .4s;border-color:var(--no)!important}
.sel{border-color:var(--pink)!important;transform:scale(1.05)}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.dots{text-align:center;font-size:22px;letter-spacing:3px;margin-bottom:8px}
.msg{min-height:34px;text-align:center;font-size:24px;font-weight:700;margin:14px 0}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{aspect-ratio:1;border:0;border-radius:18px;background:var(--pink);color:#fff;font-size:34px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:4px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.card.up{background:#fff;color:#1d2358;font-size:19px;box-shadow:none;border:4px solid var(--soft)}
.card img{width:100%;height:100%;object-fit:contain}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.col{display:grid;gap:10px;grid-auto-rows:88px}
.pic.m{aspect-ratio:auto;height:88px;padding:4px}
.opt.m{height:88px;font-size:23px;padding:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>

IMG.tag=svg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100"><path d="M3 34h10M0 48h12M5 62h9" stroke="#9aa5c8" stroke-width="3" stroke-linecap="round"/><g stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M36 40L28 64" stroke="#ec4899" stroke-width="12"/><path d="M34 46L64 41M34 46L20 53" stroke="#f6c9a0" stroke-width="5"/><path d="M28 64L42 76L50 74M28 64L16 78L8 76" stroke="#7a2a5a" stroke-width="7"/><path d="M84 38L76 62" stroke="#3b82f6" stroke-width="12"/><path d="M82 44L97 52M82 44L70 50" stroke="#f6c9a0" stroke-width="5"/><path d="M76 62L90 74L98 72M76 62L64 76L56 74" stroke="#1e3a8a" stroke-width="7"/></g><circle cx="38" cy="28" r="10" fill="#f6c9a0"/><path d="M28 27a10 10 0 0 1 20-1c-5-8-15-8-20 1z" fill="#6b3f1d"/><circle cx="29" cy="22" r="4" fill="#6b3f1d"/><circle cx="86" cy="26" r="10" fill="#f6c9a0"/><path d="M76 25a10 10 0 0 1 20-1c-5-8-15-8-20 1z" fill="#5a3418"/></svg>`);
const SETS={
 feelings:{n:'Feelings',e:'😊',c:'#ffd1e6',w:['excited','surprised','angry','happy','sad']},
 school:{n:'School',e:'✏️',c:'#ffe08a',w:['paintbrush','scissors','ink','mat','toys']},
 around:{n:'Around Us',e:'🌍',c:'#b9e8c8',w:['boy','girl','apple','turtle','insects','pen']},
 action:{n:'Action',e:'🏃',c:'#b7dcff',w:['in','tag','run','train','pit','dig']},
 all:{n:'All Words',e:'⭐',c:'#e3c9ff',w:[]}};
SETS.all.w=[].concat(SETS.feelings.w,SETS.school.w,SETS.around.w,SETS.action.w);
const GAMES=[['hear','👂','Hear it, tap the picture'],['word','🖼️','See it, tap the word'],['mem','🃏','Memory match'],['mat','🔗','Match pairs']];
const $=s=>document.querySelector(s),app=$('#app'),all=s=>app.querySelectorAll(s);
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const im=w=>`<img src="${IMG[w]}" alt="${w}">`;
let AC;function tone(f,t=.12,d=0){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+d;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.15,n);g.gain.exponentialRampToValueAtTime(.001,n+t);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+t)}catch(e){}}
const good=()=>{tone(660);tone(880,.15,.1);tone(1100,.2,.2)},bad=()=>tone(220,.25);
let VOICE=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();VOICE=v.find(x=>/^en[-_]US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}catch(e){}}
try{speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}catch(e){}
function say(t){
 try{
  const ss=window.speechSynthesis;
  if(!ss||!window.SpeechSynthesisUtterance){const m=$('.msg');if(m)m.textContent='Sound is not available in this view';return}
  if(ss.speaking||ss.pending)ss.cancel();
  const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.8;u.volume=1;if(VOICE)u.voice=VOICE;
  window._u=u;
  setTimeout(()=>{try{ss.resume();ss.speak(u)}catch(e){}},80);
 }catch(e){}
}
const shake=b=>{b.classList.remove('no');void b.offsetWidth;b.classList.add('no')};
let set='all';

function home(){
 app.innerHTML=`<h1>Read and Scan</h1><p class="sub">Pick a group of words</p><div class="grid g2">`+
 Object.entries(SETS).map(([k,s])=>`<button class="big" style="background:${s.c};${k=='all'?'grid-column:1/-1':''}" data-k="${k}"><span>${s.e}</span>${s.n}</button>`).join('')+`</div>`;
 all('[data-k]').forEach(b=>b.onclick=()=>{set=b.dataset.k;menu()});
}
function menu(){
 app.innerHTML=`<button class="back">‹ Back</button><h1>${SETS[set].e} ${SETS[set].n}</h1><p class="sub">Choose a game</p><div class="grid">`+
 GAMES.map(g=>`<button class="big" style="background:var(--soft);color:var(--ink)" data-g="${g[0]}"><span>${g[1]}</span>${g[2]}</button>`).join('')+`</div>`;
 $('.back').onclick=home;
 all('[data-g]').forEach(b=>b.onclick=()=>play(b.dataset.g));
}
function play(g){g=='mem'?mem():g=='mat'?mat():quiz(g)}

function quiz(mode){
 const pool=SETS[set].w,words=shuf(pool).slice(0,8),hear=mode=='hear';let i=0,score=0;
 const next=()=>{
  if(i>=words.length)return end(score,words.length,()=>quiz(mode));
  const w=words[i],opts=shuf([w,...shuf(pool.filter(x=>x!==w)).slice(0,2)]);let tried=false,locked=false;
  app.innerHTML=`<button class="back">‹ Back</button><div class="dots">${words.map((_,k)=>k<i?'⭐':k==i?'🔸':'▫️').join('')}</div><div class="top">`+
  (hear?`<div class="word">${w}</div>`:`<div class="pic hero">${im(w)}</div>`)+
  `<button class="say" aria-label="Hear the word">🔊</button></div><div class="${hear?'opts':'grid'}">`+
  opts.map(o=>hear?`<button class="pic" data-w="${o}">${im(o)}</button>`:`<button class="opt" data-w="${o}">${o}</button>`).join('')+`</div><div class="msg"></div>`;
  $('.back').onclick=menu;$('.say').onclick=()=>say(w);
  const h=$('.hero');if(h)h.onclick=()=>say(w);
  all('[data-w]').forEach(b=>b.onclick=()=>{
   if(locked)return;
   if(b.dataset.w==w){locked=true;b.classList.add('ok');good();say(w);if(!tried)score++;$('.msg').textContent='Great job!';setTimeout(()=>{i++;next()},1400)}
   else{tried=true;shake(b);bad();$('.msg').textContent='Try again'}
  });
  if(hear)setTimeout(()=>say(w),350);
 };
 next();
}

function mem(){
 const ws=shuf(SETS[set].w).slice(0,6),cards=shuf(ws.flatMap(w=>[{w,t:'i'},{w,t:'t'}]));
 let open=[],moves=0,done=0,lock=false;
 app.innerHTML=`<button class="back">‹ Back</button><p class="sub">Find the picture and its word</p><div class="mgrid">`+
 cards.map((c,k)=>`<button class="card" data-k="${k}">❓</button>`).join('')+`</div><div class="msg"></div>`;
 $('.back').onclick=menu;
 all('.card').forEach(b=>b.onclick=()=>{
  const c=cards[b.dataset.k];
  if(lock||b.classList.contains('up'))return;
  b.classList.add('up');b.innerHTML=c.t=='i'?im(c.w):`<b>${c.w}</b>`;tone(520,.08);
  open.push([b,c]);
  if(open.length==2){
   moves++;const[[b1,c1],[b2,c2]]=open;open=[];
   if(c1.w==c2.w){b1.classList.add('ok');b2.classList.add('ok');good();say(c1.w);
    if(++done==ws.length)setTimeout(()=>end(moves<=ws.length+3?3:moves<=ws.length*2?2:1,3,mem),1500)}
   else{lock=true;bad();setTimeout(()=>{[b1,b2].forEach(x=>{x.classList.remove('up');x.textContent='❓'});lock=false},1000)}
  }
 });
}

function mat(){
 const ws=shuf(SETS[set].w).slice(0,5);let sel=null,done=0;
 const Lc=shuf(ws);let Rc=shuf(ws);while(Rc.some((w,i)=>w==Lc[i]))Rc=shuf(ws);
 app.innerHTML=`<button class="back">‹ Back</button><p class="sub">Tap a picture, then its word</p><div class="two"><div class="col">`+
 Lc.map(w=>`<button class="pic m" data-p="${w}">${im(w)}</button>`).join('')+`</div><div class="col">`+
 Rc.map(w=>`<button class="opt m" data-t="${w}">${w}</button>`).join('')+`</div></div><div class="msg"></div>`;
 $('.back').onclick=menu;
 all('[data-p]').forEach(b=>b.onclick=()=>{
  if(b.classList.contains('ok'))return;
  all('[data-p]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b;say(b.dataset.p);$('.msg').textContent='';
 });
 all('[data-t]').forEach(b=>b.onclick=()=>{
  if(!sel||b.classList.contains('ok'))return;
  if(sel.dataset.p==b.dataset.t){sel.classList.remove('sel');sel.classList.add('ok');b.classList.add('ok');sel=null;good();
   if(++done==ws.length)setTimeout(()=>end(3,3,mat),1000)}
  else{shake(b);bad();$('.msg').textContent='Try again'}
 });
}

function end(s,n,again){
 const st=Math.max(1,Math.round(s/n*3));good();
 app.innerHTML=`<h1>Great job!</h1><div class="word" style="text-align:center;margin:18px 0">${'⭐'.repeat(st)}</div><div class="grid">`+
 `<button class="big" style="background:var(--sun)" id="a"><span>🔁</span>Play again</button>`+
 `<button class="big" style="background:var(--soft);color:var(--ink)" id="m"><span>🎮</span>Choose a game</button></div>`;
 $('#a').onclick=again;$('#m').onclick=menu;
}
home();
</script></body></html>
