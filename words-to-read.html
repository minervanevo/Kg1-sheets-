<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Words to Read</title>
<style>
:root{--bg:#fff6e5;--card:#fff;--ink:#1d2358;--line:#efdcb8;--sun:#ffd166;--ok:#2fa05a;--no:#f59e0b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1636;--card:#2b2352;--ink:#fff;--line:#4a3a7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1636;--card:#2b2352;--ink:#fff;--line:#4a3a7a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;padding:12px 14px 40px}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid #4aa8f0;outline-offset:2px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tab{border:3px solid transparent;border-radius:20px;padding:12px 6px;font-size:22px;font-weight:800;color:#1d2358;opacity:.55}
.tab.on{opacity:1;border-color:#1d2358}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.pill{border:3px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:18px;font-weight:700}
.pill.on{background:var(--sun);border-color:#1d2358;color:#1d2358}
.strip{border-radius:16px;padding:10px;text-align:center;font-size:17px;font-weight:700;color:#14305e;line-height:1.5}
.ex{background:var(--card);border:3px solid var(--line);border-radius:28px;padding:14px 12px 18px;min-height:280px}
.hint{text-align:center;opacity:.85;font-size:18px;margin:0 0 12px}
.grid{display:grid;gap:12px}
.top{text-align:center;margin:4px 0 14px}
.word{font-size:54px;font-weight:800;line-height:1.1;margin-bottom:10px}
.pic{background:#fff;border-radius:20px;border:3px solid var(--line);padding:6px;display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:1}
.pic img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.hero{width:min(52vw,210px);margin:0 auto 10px}
.opts{display:grid;gap:10px;grid-template-columns:repeat(3,1fr)}
.opt{background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:20px;font-size:27px;font-weight:700;padding:12px 8px}
.say{border:0;border-radius:50%;width:62px;height:62px;font-size:28px;background:var(--sun);box-shadow:0 4px 0 rgba(0,0,0,.2)}
.ok{border-color:var(--ok)!important;background:#d9f7e3!important;color:#14532d!important}
.no{animation:shake .4s;border-color:var(--no)!important}
.sel{border-color:#f0559a!important;transform:scale(1.04)}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.dots{text-align:center;font-size:20px;letter-spacing:3px;margin-bottom:6px}
.msg{min-height:30px;text-align:center;font-size:22px;font-weight:700;margin-top:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col{display:grid;gap:8px;grid-auto-rows:var(--rh,88px)}
.pic.m{aspect-ratio:auto;height:var(--rh,88px);padding:3px}
.opt.m{height:var(--rh,88px);font-size:22px;padding:2px}
.mgrid{display:grid;gap:8px}
.mc{aspect-ratio:1;border:0;border-radius:16px;background:#f0559a;color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;padding:2px;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.mc.up{background:#fff;color:#1d2358;font-size:inherit;box-shadow:none;border:3px solid var(--line)}
.mc img{width:100%;height:100%;object-fit:contain}
.big2{text-align:center;font-size:30px;margin:10px 0}
.act{border:0;border-radius:22px;padding:16px;font-size:22px;font-weight:800;color:#1d2358;background:var(--sun);box-shadow:0 4px 0 rgba(0,0,0,.2)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>

const BOOKS={"splash": {"n": "Splash", "c": "#fcd9a5", "parts": [["excited", "surprised", "angry", "paintbrush", "scissors", "boy", "girl", "apple"]]}, "ol": {"n": "English OL", "c": "#c5ead8", "parts": [["turtle", "toys", "train", "ink", "insects"], ["tag", "mat", "in", "dig", "pit", "pen"]]}};
// every week: add a new list of words at the end of the right book's parts
const MODES=[['match','Match'],['listen','Listen'],['read','Read'],['memory','Memory']];
const $=s=>document.querySelector(s),ex=()=>$('#ex'),qa=s=>document.querySelectorAll(s);
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const im=w=>`<img src="${IMG[w]}" alt="${w}">`;
let AC;function tone(f,t=.12,d=0){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+d;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.15,n);g.gain.exponentialRampToValueAtTime(.001,n+t);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+t)}catch(e){}}
const good=()=>{tone(660);tone(880,.15,.1);tone(1100,.2,.2)},bad=()=>tone(220,.25);
let VOICE=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();VOICE=v.find(x=>/^en[-_]US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}catch(e){}}
try{speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}catch(e){}
function say(t){
 try{
  const ss=window.speechSynthesis;
  if(!ss||!window.SpeechSynthesisUtterance){const m=$('.msg');if(m)m.textContent='Sound is not available in this view';return}
  if(ss.speaking||ss.pending)ss.cancel();
  const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.8;u.volume=1;if(VOICE)u.voice=VOICE;
  window._u=u;setTimeout(()=>{try{ss.resume();ss.speak(u)}catch(e){}},80);
 }catch(e){}
}
const shake=b=>{b.classList.remove('no');void b.offsetWidth;b.classList.add('no')};
let bk='splash',pi=0,mode='match',RUN=0;
const words=()=>BOOKS[bk].parts[pi];

function render(){
 RUN++;const b=BOOKS[bk];
 $('#app').innerHTML=`<div class="tabs">${Object.entries(BOOKS).map(([k,x])=>`<button class="tab${k==bk?' on':''}" style="background:${x.c}" data-b="${k}">${x.n}</button>`).join('')}</div>`+
 `<div class="pills">${b.parts.map((p,i)=>`<button class="pill${i==pi?' on':''}" data-p="${i}">Part ${i+1}</button>`).join('')}</div>`+
 `<div class="strip" style="background:${b.c}">${words().join(' · ')}</div>`+
 `<div class="pills">${MODES.map(([k,n])=>`<button class="pill${k==mode?' on':''}" data-m="${k}">${n}</button>`).join('')}</div><div class="ex" id="ex"></div>`;
 qa('[data-b]').forEach(x=>x.onclick=()=>{bk=x.dataset.b;pi=0;render()});
 qa('[data-p]').forEach(x=>x.onclick=()=>{pi=+x.dataset.p;render()});
 qa('[data-m]').forEach(x=>x.onclick=()=>{mode=x.dataset.m;render()});
 ({match,listen:()=>quiz(1),read:()=>quiz(0),memory})[mode]();
}

function quiz(listen){
 const pool=words(),qs=shuf(pool),my=RUN;let i=0,score=0;
 const next=()=>{
  if(my!=RUN)return;
  if(i>=qs.length)return end(score,qs.length);
  const w=qs[i],opts=shuf([w,...shuf(pool.filter(x=>x!=w)).slice(0,2)]);let tried=0,lock=0;
  ex().innerHTML=`<div class="dots">${qs.map((_,k)=>k<i?'⭐':k==i?'🔸':'▫️').join('')}</div><div class="top">${listen?`<div class="word">${w}</div>`:`<div class="pic hero">${im(w)}</div>`}<button class="say" aria-label="Hear the word">🔊</button></div>`+
  `<div class="${listen?'opts':'grid'}">${opts.map(o=>listen?`<button class="pic" data-w="${o}">${im(o)}</button>`:`<button class="opt" data-w="${o}">${o}</button>`).join('')}</div><div class="msg"></div>`;
  $('.say').onclick=()=>say(w);const h=$('.hero');if(h)h.onclick=()=>say(w);
  qa('[data-w]').forEach(b=>b.onclick=()=>{
   if(lock)return;
   if(b.dataset.w==w){lock=1;b.classList.add('ok');good();say(w);if(!tried)score++;$('.msg').textContent='Great job!';setTimeout(()=>{i++;next()},1400)}
   else{tried=1;shake(b);bad();$('.msg').textContent='Try again'}
  });
  if(listen)setTimeout(()=>{if(my==RUN)say(w)},350);
 };
 next();
}

function match(){
 const ws=words().slice(0,8),n=ws.length,my=RUN;let sel=null,done=0;
 const Lc=shuf(ws),gap=n>=4?2:1;let Rc=shuf(ws),t=0;
 while(Rc.some((w,i)=>Math.abs(Lc.indexOf(w)-i)<gap)&&t++<20000)Rc=shuf(ws);
 const rh=Math.round(Math.max(60,Math.min(88,(innerHeight-300)/n)));
 ex().innerHTML=`<p class="hint">Tap a picture, then its word. <b id="cnt">0/${n}</b></p><div class="two" style="--rh:${rh}px"><div class="col">${Lc.map(w=>`<button class="pic m" data-pic="${w}">${im(w)}</button>`).join('')}</div><div class="col">${Rc.map(w=>`<button class="opt m" data-t="${w}">${w}</button>`).join('')}</div></div><div class="msg"></div>`;
 qa('[data-pic]').forEach(b=>b.onclick=()=>{
  if(b.classList.contains('ok'))return;
  qa('[data-pic]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b;say(b.dataset.pic);$('.msg').textContent='';
 });
 qa('[data-t]').forEach(b=>b.onclick=()=>{
  if(!sel||b.classList.contains('ok'))return;
  if(sel.dataset.pic==b.dataset.t){sel.classList.remove('sel');sel.classList.add('ok');b.classList.add('ok');sel=null;good();done++;$('#cnt').textContent=done+'/'+n;
   if(done==n)setTimeout(()=>{if(my==RUN)end(3,3)},900)}
  else{shake(b);bad();$('.msg').textContent='Try again'}
 });
}

function memory(){
 const ws=words().slice(0,8),n=ws.length,my=RUN,cards=shuf(ws.flatMap(w=>[{w,t:'i'},{w,t:'t'}]));
 let open=[],moves=0,done=0,lock=false;const cols=cards.length>12?4:3,fs=cols==4?'clamp(11px,3.1vw,15px)':'clamp(14px,4.6vw,19px)';
 ex().innerHTML=`<p class="hint">Find the picture and its word. <b id="cnt">0/${n}</b></p><div class="mgrid" style="grid-template-columns:repeat(${cols},1fr);font-size:${fs}">${cards.map((c,k)=>`<button class="mc" data-k="${k}">❓</button>`).join('')}</div><div class="msg"></div>`;
 qa('.mc').forEach(b=>b.onclick=()=>{
  const c=cards[b.dataset.k];
  if(lock||b.classList.contains('up'))return;
  b.classList.add('up');b.innerHTML=c.t=='i'?im(c.w):`<b>${c.w}</b>`;tone(520,.08);
  open.push([b,c]);
  if(open.length==2){
   moves++;const[[b1,c1],[b2,c2]]=open;open=[];
   if(c1.w==c2.w){b1.classList.add('ok');b2.classList.add('ok');good();say(c1.w);done++;$('#cnt').textContent=done+'/'+n;
    if(done==n)setTimeout(()=>{if(my==RUN)end(moves<=n+3?3:moves<=n*2?2:1,3)},1500)}
   else{lock=true;bad();setTimeout(()=>{[b1,b2].forEach(x=>{x.classList.remove('up');x.textContent='❓'});lock=false},1000)}
  }
 });
}

function end(s,n){
 const st=Math.max(1,Math.round(s/n*3));good();
 ex().innerHTML=`<h2 class="big2">Great job!</h2><div class="word" style="text-align:center">${'⭐'.repeat(st)}</div><div class="grid"><button class="act" id="a">🔁 Play again</button><button class="act" id="n" style="background:var(--card);border:3px solid var(--line);color:var(--ink)">▶ Next game</button></div>`;
 $('#a').onclick=render;$('#n').onclick=()=>{mode=MODES[(MODES.findIndex(m=>m[0]==mode)+1)%MODES.length][0];render()};
}
render();
</script></body></html>
