<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phonics practice</title>
<style>
:root{--bg:#EAF4FF;--ink:#1B2A49;--card:#fff;--s:#E8505B;--a:#2F6FDE;--t:#1E9E6A;--i:#F08A24;--n:#7B4FD1;--p:#D6338A;--e:#0E93AD;--c:#8A5A2B;--k:#B8860B;--h:#4E5D78;--r:#00796B;--ok:#1E9E6A;--no:#D64545}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Comic Sans MS","Trebuchet MS",sans-serif;padding:12px;max-width:560px;margin:auto}
h1{font-size:22px;margin:4px 0 10px;text-align:center}
.row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
.pill{border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:15px;cursor:pointer}
.pill.on{background:var(--ink);color:#fff}
.pill.big{font-size:18px;font-weight:800;padding:8px 22px;border-radius:14px}
.strip{text-align:center;margin:4px 0 10px}
.strip b{font-size:26px;display:block;line-height:1.1}
.card{background:var(--card);border-radius:20px;padding:16px 12px;min-height:310px;text-align:center;border:2px solid var(--ink)}
.q{font-size:18px;margin:0 0 8px}
.word{font-size:56px;font-weight:800;letter-spacing:2px;margin:6px 0 12px}
.opts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.opt{min-width:84px;min-height:60px;font:inherit;font-size:32px;font-weight:800;border:3px solid var(--ink);background:#fff;border-radius:16px;cursor:pointer;padding:4px 14px}
.opt.right,.tile.right,.mp.right,.mw.right{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong,.tile.wrong,.mp.wrong,.mw.wrong{background:#fde2e2;border-color:var(--no);animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.act{margin-top:14px;font:inherit;font-size:20px;font-weight:700;background:var(--ink);color:#fff;border:0;border-radius:14px;padding:10px 22px;cursor:pointer}
.act.alt{background:#fff;color:var(--ink);border:2px solid var(--ink);font-size:16px;margin-left:6px}
.boxes{display:flex;justify-content:center;gap:14px;margin:18px 0 6px;transition:gap .5s}
.boxes.join{gap:0}
.bx{font-size:68px;font-weight:800;min-width:56px;border-radius:12px;padding:0 6px;transition:background .2s}
.bx.lit{background:#FFE08A}
.msg{min-height:26px;font-size:18px;margin-top:8px;font-weight:700}
.lc{display:inline-block;vertical-align:top;margin:0 7px;text-align:center}
.lc small{display:block;font-size:12px;font-weight:600;line-height:1.25;color:#55627f}
.slots{display:flex;gap:8px;justify-content:center;margin:10px 0}
.slot{width:54px;height:62px;border:3px dashed #9aa6bf;border-radius:12px;font-size:40px;font-weight:800;line-height:56px}
.tile{font:inherit;font-size:36px;font-weight:800;width:62px;height:66px;background:#fff;border:3px solid var(--ink);border-radius:14px;cursor:pointer;padding:0}
.tile.used{opacity:.25;pointer-events:none}
.mt{display:flex;justify-content:space-between;gap:14px}
.mt>div{flex:1;display:flex;flex-direction:column;gap:6px}
.mp,.mw{font:inherit;border:3px solid var(--ink);background:#fff;border-radius:14px;cursor:pointer;height:50px;padding:0;overflow:hidden}
.mw{font-size:26px;font-weight:800}.mp.sel,.mw.sel{background:#FFE08A}
.mp.right,.mw.right{pointer-events:none}
/* motivation */
.stairs{position:relative;display:flex;align-items:flex-end;gap:3px;height:110px;margin:12px 6px 0 46px}
.st{flex:1;border-radius:6px 6px 0 0;opacity:.95}
.chr{position:absolute;font-size:30px;line-height:1;transition:left .45s ease,bottom .45s ease}
.chr.hop{animation:hop .5s}
@keyframes hop{50%{transform:translateY(-22px) rotate(-10deg)}}
.flag{position:absolute;right:0;top:-6px;font-size:26px}
.sbar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#55627f;margin:4px 6px 0 6px}
.mute{background:none;border:0;font-size:18px;cursor:pointer}
.pt{position:fixed;pointer-events:none;transition:transform .9s ease-out,opacity .9s;z-index:50;font-size:24px}
.ov{position:fixed;inset:0;background:rgba(27,42,73,.82);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center}
.ov .t{font-size:96px;animation:pop .6s}.ov .m{font-size:30px;font-weight:800;margin-top:10px}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
</style></head><body>
<h1>Phonics practice <span style="font-size:11px;font-weight:600;color:#55627f;display:block">version: 3 Nov 2026 (Weeks 1-5)</span></h1>

<div class="row" id="wk"></div>
<div class="strip" id="strip"></div>
<div class="row" id="modes"></div>
<div class="card" id="card"></div>
<div class="sbar"><span>Climb to the top!</span><button class="mute" id="mute" onclick="togMute()">🔊</button></div>
<div class="stairs" id="stairs"></div>

var PM=[['first','First sound'],['mfirst','Match letter'],['yn','Yes or No?'],['blend','Blend'],['read','Read'],['where','Where?']];
var SM=[['smatch','Match'],['sbuild','Build it'],['smiss','Missing letter'],['spick','Right spelling']];
var CHARS=['🦘','🐸','🐰','🐵','🐧','🦄','🐢','🐿️'],STEPC=['#E8505B','#F08A24','#E6B800','#1E9E6A','#2F6FDE','#7B4FD1'];
var CHEERS=['Yes!','Great!','Super!','Wow!','Awesome!','Bravo!','Fantastic!'];
function $(i){return document.getElementById(i)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function say(w){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.75;speechSynthesis.speak(u)}catch(e){}}
function col(l){return COL[l]?'var('+COL[l]+')':'#1B2A49'}
/* ---------- motivation: stairs, hopping character, celebrations ---------- */
var TOTAL=8;
function setTotal(n){TOTAL=Math.max(2,n);prog=0;buildStairs()}
function buildStairs(){
 var h='',n=TOTAL;for(var i=0;i<n;i++)h+='<div class="st" style="height:'+(20+i*(84/(n-1)))+'px;background:'+STEPC[i%STEPC.length]+'"></div>';
 $('stairs').innerHTML=h+'<div class="flag">🏆</div><div class="chr" id="chr"></div>';placeChr();
}
function placeChr(){
 var c=$('chr');c.textContent=CHARS[chrI%CHARS.length];
 if(prog<=0){c.style.left='-40px';c.style.bottom='0px'}
 else{var st=$('stairs').getElementsByClassName('st')[Math.min(prog,TOTAL)-1];c.style.left=(st.offsetLeft+st.offsetWidth/2-15)+'px';c.style.bottom=st.offsetHeight+'px'}
}
function tone(fs){if(muted)return;try{var A=window.AC||(window.AC=new(window.AudioContext||window.webkitAudioContext)());fs.forEach(function(f,i){var o=A.createOscillator(),g=A.createGain();o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(A.destination);var t=A.currentTime+i*.12;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.3)})}catch(e){}}
function togMute(){muted=!muted;$('mute').textContent=muted?'🔇':'🔊'}
function burst(el,n){
 var r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/3,E=['⭐','🎉','✨','💛','🌟','🎈'];
 for(var i=0;i<n;i++){var p=document.createElement('div');p.className='pt';p.textContent=pick(E);p.style.left=cx+'px';p.style.top=cy+'px';document.body.appendChild(p);
  (function(p){var dx=(Math.random()-.5)*340,dy=-60-Math.random()*200;requestAnimationFrame(function(){requestAnimationFrame(function(){p.style.transform='translate('+dx+'px,'+dy+'px) rotate('+(Math.random()*360)+'deg)';p.style.opacity=0})});setTimeout(function(){p.remove()},1000)})(p)}
}
function rain(n){
 var E=['🎉','⭐','🎈','🌟','🎊','💖','🍭'];
 for(var i=0;i<n;i++){var p=document.createElement('div');p.className='pt';p.style.zIndex=70;p.style.transition='transform '+(1.6+Math.random()*1.4)+'s ease-in,opacity 2.6s';p.textContent=pick(E);p.style.left=(Math.random()*100)+'vw';p.style.top='-40px';document.body.appendChild(p);
  (function(p){setTimeout(function(){p.style.transform='translateY('+(window.innerHeight+80)+'px) rotate('+(Math.random()*720)+'deg)';p.style.opacity=.9},Math.random()*600);setTimeout(function(){p.remove()},3600)})(p)}
}
function big(){
 var ov=document.createElement('div');ov.className='ov';
 ov.innerHTML='<div class="t">🏆</div><div style="font-size:64px">'+CHARS[chrI%CHARS.length]+'</div><div class="m">You reached the top!<br>Super star! 🌟</div><button class="act" style="background:#fff;color:#1B2A49">Keep going</button>';
 document.body.appendChild(ov);rain(60);tone([523,659,784,1047,784,1047]);
 var done=function(){ov.remove();prog=0;chrI++;placeChr()};
 ov.onclick=done;setTimeout(function(){if(ov.parentNode)done()},4500);
}
function cheer(){var m=$('msg');if(m)m.textContent=pick(CHEERS)+' '+pick(['🎉','⭐','🌟','👏','🥳'])}
function good(){
 prog++;var c=$('chr');placeChr();c.classList.remove('hop');void c.offsetWidth;c.classList.add('hop');
 burst($('card'),12);tone([880,1175]);cheer();
 if(prog>=TOTAL)setTimeout(big,700);
}
/* ---------- layout ---------- */
function head(){
 $('secs').innerHTML='<button class="pill big'+(sec=='ph'?' on':'')+'" onclick="setSec(\'ph\')">Phonics</button><button class="pill big'+(sec=='st'?' on':'')+'" onclick="setSec(\'st\')">To study</button>';
 if(sec=='ph'){
  $('wk').innerHTML=WEEKS.map(function(_,i){var w=i+1;return '<button class="pill'+(w==wk?' on':'')+'" onclick="setWk('+w+')">Week '+w+'</button>'}).join('');
  var its=ITEMSW(wk);
  $('strip').innerHTML=LETS(wk).map(function(l){var ws=its.filter(function(x){return x[0][0]==l}).map(function(x){return x[0]}).join('<br>');return '<div class="lc"><b style="color:'+col(l)+'">'+l+'</b><small>'+ws+'</small></div>'}).join('');
 }else{
  $('wk').innerHTML=STUDY.map(function(p,i){var w=i+1;return '<button class="pill'+(w==sw?' on':'')+'" onclick="setSw('+w+')">'+p.name+'</button>'}).join('');
  $('strip').innerHTML=STUDY[sw-1].words.map(function(x){return '<div class="lc">'+pic(x,30)+'<small style="font-size:15px;color:#1B2A49;font-weight:800">'+x[0]+'</small></div>'}).join('');
 }
 var M=sec=='ph'?PM:SM;
 $('modes').innerHTML=M.map(function(m){return '<button class="pill'+(m[0]==mode?' on':'')+'" onclick="setMode(\''+m[0]+'\')">'+m[1]+'</button>'}).join('');
}
function setSec(s){sec=s;mode=s=='ph'?'first':'smatch';go()}
function setWk(w){wk=w;go()}
function setSw(w){sw=w;go()}
function setMode(m){mode=m;go()}
var FN={mfirst:mfirst,yn:yn,first:first,blend:blend,read:read,where:where,smatch:smatch,sbuild:sbuild,smiss:smiss,spick:spick};
function go(){head();step=0;queue=[];sel=null;if(mode!='smatch'&&mode!='mfirst')setTotal((mode=='sbuild'||mode=='smiss'||mode=='spick')?SW().length:8);FN[mode]()}
function opts(list){return '<div class="opts">'+list.map(function(o){return '<button class="opt" data-o="'+o+'">'+o+'</button>'}).join('')+'</div>'}
function wire(right,fn,ex){
 var bs=document.querySelectorAll('.opt');
 for(var i=0;i<bs.length;i++)bs[i].onclick=function(){
  if(this.dataset.o==right){this.className='opt right';good();if(ex)ex();setTimeout(fn,950)}
  else{this.className='opt wrong';$('msg').textContent='Try again'}};
}
/* ---------- phonics games ---------- */
function yn(){
 var pool=ITEMSW(wk).concat(upto('extra',wk)),it=pick(pool),L=LETS(wk),own=it[0][0];
 var yes=L.indexOf(own)>-1&&Math.random()<.5;
 var l=yes?own:pick(L.filter(function(x){return x!=own}));
 var right=yes?'✓':'✗';
 $('card').innerHTML='<p class="q">Does it start with <b style="display:inline-block;width:42px;height:42px;line-height:38px;border:3px solid '+col(l)+';border-radius:50%;color:'+col(l)+';font-size:28px">'+l+'</b> ?</p>'+pic(it,90)+'<br><button class="act alt" onclick="say(\''+it[0]+'\')" style="margin:8px 0 0">🔊 Hear</button>'+opts(['✓','✗']).replace(/class="opt"/g,'class="opt" style="font-size:44px;min-width:110px;min-height:76px"')+'<div class="msg" id="msg"></div>';
 var bs=document.querySelectorAll('.opt');bs[0].style.color='#1E9E6A';bs[1].style.color='#D64545';
 wire(right,yn,function(){say(it[0])});
}
function mfirst(){
 var L=LETS(wk),its=ITEMSW(wk).filter(function(x){return L.indexOf(x[0][0])>-1}),n=Math.min(5,its.length),ch=[],used={},dn=0;
 shuffle(its).forEach(function(x){if(ch.length<n&&!used[x[0][0]]){used[x[0][0]]=1;ch.push(x)}});
 shuffle(its).forEach(function(x){if(ch.length<n&&ch.indexOf(x)<0)ch.push(x)});
 setTotal(n);
 var left=shuffle(ch),dl=Object.keys(used).length,lets=ch.map(function(x){return x[0][0]}),R=null;
 for(var t=0;t<3000&&!R;t++){var c=shuffle(lets),ok=true;
  for(var j=0;j<n&&ok;j++)for(var q=0;q<n;q++)if(left[q][0][0]==c[j]){var d=Math.abs(q-j);if(dl>=4?d<2:q==j){ok=false;break}}
  if(ok)R=c}
 if(!R)R=shuffle(lets);
 var lh=left.map(function(x){return '<button class="mp" data-l="'+x[0][0]+'" data-w="'+x[0]+'">'+pic(x,34)+'</button>'}).join('');
 var rh=R.map(function(l){return '<button class="mw" data-l="'+l+'" style="color:'+col(l)+';font-size:34px">'+l+'</button>'}).join('');
 $('card').innerHTML='<p class="q">Match each picture to its first letter</p><div class="mt"><div>'+lh+'</div><div>'+rh+'</div></div><div class="msg" id="msg"></div>';
 sel=null;var A=document.querySelectorAll('.mp'),B=document.querySelectorAll('.mw');
 for(var i=0;i<A.length;i++)A[i].onclick=function(){if(this.classList.contains('right'))return;[].forEach.call(A,function(b){b.classList.remove('sel')});this.classList.add('sel');sel=this};
 for(var i=0;i<B.length;i++)B[i].onclick=function(){
  if(!sel||this.classList.contains('right'))return;
  if(sel.dataset.l==this.dataset.l){sel.className='mp right';this.className='mw right';this.style.color='#fff';say(sel.dataset.w);sel=null;good();if(++dn==n)setTimeout(mfirst,1600)}
  else{var b=this;b.classList.add('wrong');setTimeout(function(){b.classList.remove('wrong')},350);$('msg').textContent='Try again'}};
}
function first(){
 var it=pick(ITEMSW(wk));var right=it[0][0],L=LETS(wk);
 var o=shuffle([right].concat(shuffle(L.filter(function(l){return l!=right})).slice(0,2)));
 $('card').innerHTML='<p class="q">What is the first sound?</p>'+pic(it,96)+'<br><button class="act alt" onclick="say(\''+it[0]+'\')" style="margin:8px 0 0">🔊 Hear</button>'+opts(o)+'<div class="msg" id="msg"></div>';
 wire(right,first);
}
function blend(){
 var w=pick(BLW(wk));cur=w;step=0;
 $('card').innerHTML='<p class="q">Say each sound. Then blend!</p><div class="boxes" id="bx">'+w.split('').map(function(l,i){return '<span class="bx" id="b'+i+'" style="color:'+col(l)+'">'+l+'</span>'}).join('')+'</div><div class="msg" id="msg"></div><button class="act" id="nx" onclick="bstep()">Next sound</button><div id="hr"></div>';
}
function bstep(){
 var n=cur.length;
 if(step<n){for(var i=0;i<n;i++)$('b'+i).className='bx'+(i==step?' lit':'');step++;if(step==n)$('nx').textContent='Blend it!'}
 else if(step==n){for(var i=0;i<n;i++)$('b'+i).className='bx';$('bx').className='boxes join';say(cur);step++;$('nx').textContent='Next word';$('hr').innerHTML='<button class="act alt" onclick="say(cur)" style="margin:12px 0 0;font-size:18px">🔊 Hear again</button>';good();$('msg').textContent=cur+' '+pick(['🎉','⭐','🌟'])}
 else blend();
}
function read(){
 var w=pick(BLW(wk).concat(SENTW(wk)));var sp=w.indexOf(' ')>-1;
 $('card').innerHTML='<p class="q">Read it by yourself</p><div class="word" style="font-size:'+(sp?40:64)+'px">'+w.split('').map(function(l){return COL[l.toLowerCase()]?'<span style="color:'+col(l.toLowerCase())+'">'+l+'</span>':l}).join('')+'</div><button class="act" id="rd">I read it</button><div class="msg" id="msg"></div>';
 $('rd').onclick=function(){say(w);good();$('msg').textContent='Did you say it right? 👍';$('rd').textContent='Next';$('rd').onclick=read};
}
function where(){
 var it,l,tries=0;
 while(tries++<80){it=pick(ITEMSW(wk));var cs=LETS(wk).filter(function(c){return it[0].split(c).length==2});if(cs.length){l=pick(cs);break}}
 var w=it[0],p=w.indexOf(l),right=p==0?'Beginning':(p==w.length-1?'End':'Middle');
 var wh=w.split('').map(function(c){return c==l?'<span style="color:'+col(l)+';text-decoration:underline">'+c+'</span>':c}).join('');
 $('card').innerHTML='<p class="q">Where is the sound <b style="color:'+col(l)+'">'+l+'</b>?</p>'+pic(it,70)+'<div class="word" style="font-size:44px;margin:4px 0 0">'+wh+'</div>'+opts(['Beginning','Middle','End']).replace(/class="opt"/g,'class="opt" style="font-size:20px"')+'<div class="msg" id="msg"></div>';
 wire(right,where);
}
/* ---------- to study: spelling games (all words of the part in every game) ---------- */
function SW(){return STUDY[sw-1].words}
function nextW(){if(!queue.length)queue=shuffle(SW());return queue.pop()}
function smatch(){
 var W=SW(),n=W.length,L=shuffle(W),R=null,dn=0;setTotal(n);
 for(var t=0;t<800&&!R;t++){var c=shuffle(W),ok=true;for(var j=0;j<n;j++){if(Math.abs(L.indexOf(c[j])-j)<2){ok=false;break}}if(ok)R=c}
 if(!R){R=L.map(function(_,j){return L[(j+2)%n]})}
 var left=L.map(function(x,i){return '<button class="mp" data-w="'+x[0]+'">'+pic(x,34)+'</button>'}).join('');
 var right=R.map(function(x){return '<button class="mw" data-w="'+x[0]+'">'+x[0]+'</button>'}).join('');
 $('card').innerHTML='<p class="q">Match the picture to its word</p><div class="mt"><div id="lp">'+left+'</div><div id="rw">'+right+'</div></div><div class="msg" id="msg"></div>';
 sel=null;var left_=document.querySelectorAll('.mp'),right_=document.querySelectorAll('.mw');
 for(var i=0;i<left_.length;i++)left_[i].onclick=function(){if(this.classList.contains('right'))return;[].forEach.call(left_,function(b){b.classList.remove('sel')});this.classList.add('sel');sel=this};
 for(var i=0;i<right_.length;i++)right_[i].onclick=function(){
  if(!sel||this.classList.contains('right'))return;
  if(sel.dataset.w==this.dataset.w){sel.className='mp right';this.className='mw right';say(this.dataset.w);sel=null;good();if(++dn==n)setTimeout(smatch,1600)}
  else{var b=this;b.classList.add('wrong');setTimeout(function(){b.classList.remove('wrong')},350);$('msg').textContent='Try again'}};
}
function sbuild(){
 var it=nextW(),w=it[0],sc,pos=0;
 do{sc=shuffle(w.split(''))}while(sc.join('')==w);
 $('card').innerHTML='<p class="q">Build the word</p>'+pic(it,70)+'<div class="slots">'+w.split('').map(function(_,i){return '<div class="slot" id="sl'+i+'"></div>'}).join('')+'</div><div class="opts" style="margin-top:6px">'+sc.map(function(l,i){return '<button class="tile" data-l="'+l+'">'+l+'</button>'}).join('')+'</div><button class="act alt" onclick="say(\''+w+'\')" style="margin:10px 0 0">🔊 Hear</button><div class="msg" id="msg"></div>';
 var ts=document.querySelectorAll('.tile');
 for(var i=0;i<ts.length;i++)ts[i].onclick=function(){
  if(this.classList.contains('used'))return;
  if(this.dataset.l==w[pos]){$('sl'+pos).textContent=this.dataset.l;$('sl'+pos).style.color=col(this.dataset.l);$('sl'+pos).style.borderStyle='solid';this.classList.add('used');pos++;
   if(pos==w.length){say(w);good();setTimeout(sbuild,1300)}}
  else{var b=this;b.classList.add('wrong');setTimeout(function(){b.classList.remove('wrong')},350)}};
}
function smiss(){
 var it=nextW(),w=it[0],p=Math.floor(Math.random()*w.length),r=w[p];
 var pool=LETS(WEEKS.length).filter(function(l){return l!=r});
 var o=shuffle([r].concat(shuffle(pool).slice(0,2)));
 var sh=w.split('').map(function(c,i){return i==p?'<span style="display:inline-block;min-width:44px;border-bottom:5px solid #9aa6bf">&nbsp;</span>':c}).join('');
 $('card').innerHTML='<p class="q">Which letter is missing?</p>'+pic(it,70)+'<div class="word" style="font-size:56px;margin:6px 0 0">'+sh+'</div>'+opts(o)+'<button class="act alt" onclick="say(\''+w+'\')" style="margin:10px 0 0">🔊 Hear</button><div class="msg" id="msg"></div>';
 wire(r,smiss,function(){say(w)});
}
function allWords(){var r=[];STUDY.forEach(function(p){p.words.forEach(function(x){r.push(x[0])})});WEEKS.forEach(function(w){w.blend.forEach(function(x){r.push(x)});w.items.forEach(function(x){r.push(x[0])})});return r.filter(function(x,k,a){return a.indexOf(x)==k})}
/* wrong options come from our own words, same first letter first, then similar length */
function wrongs(w){
 var P=allWords().filter(function(x){return x!=w}),d=function(x){return Math.abs(x.length-w.length)+Math.random()*.9};
 var same=P.filter(function(x){return x[0]==w[0]}).sort(function(a,b){return d(a)-d(b)});
 var rest=P.filter(function(x){return x[0]!=w[0]}).sort(function(a,b){return d(a)-d(b)});
 return same.concat(rest).slice(0,2);
}
function spick(){
 var it=nextW(),w=it[0],o=shuffle([w].concat(wrongs(w)));
 $('card').innerHTML='<p class="q">Which spelling is right?</p>'+pic(it,80)+'<br><button class="act alt" onclick="say(\''+w+'\')" style="margin:8px 0 0">🔊 Hear</button>'+opts(o).replace(/class="opt"/g,'class="opt" style="font-size:30px;min-width:96px"')+'<div class="msg" id="msg"></div>';
 wire(w,spick);
}
buildStairs();go();
window.addEventListener('resize',placeChr);
</script></body></html>
